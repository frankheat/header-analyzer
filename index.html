<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- The app never talks to the network: everything it analyses stays in this tab.
       `file:` lets the unbuilt folder open by double-click in browsers where 'self'
       does not match file URLs; the single-file build pins hashes instead. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src 'self' file: data:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Header Analyzer analyses the security headers of a raw HTTP response, entirely in your browser.">
  <title>Header Analyzer</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="src/ui/theme.js"></script>
</head>
<body>

  <a class="skip-link" href="#results">Skip to results</a>

  <header class="top-app-bar" role="banner">
    <div class="app-bar-title">
      <span class="app-logo" aria-hidden="true"><svg><use href="#i-logo"></use></svg></span>
      <h1>Header Analyzer</h1>
    </div>

    <div class="segmented" role="radiogroup" aria-label="Profile" id="profile-control">
      <button type="button" role="radio" data-profile="basic" aria-checked="true"><svg class="seg-check" aria-hidden="true"><use href="#i-check"></use></svg>Basic</button>
      <button type="button" role="radio" data-profile="extended" aria-checked="false"><svg class="seg-check" aria-hidden="true"><use href="#i-check"></use></svg>Extended</button>
    </div>

    <div class="segmented" role="radiogroup" aria-label="Response type" id="mode-control">
      <button type="button" role="radio" data-mode="page" aria-checked="true"><svg class="seg-check" aria-hidden="true"><use href="#i-check"></use></svg>Web page</button>
      <button type="button" role="radio" data-mode="api" aria-checked="false"><svg class="seg-check" aria-hidden="true"><use href="#i-check"></use></svg>REST API</button>
    </div>

    <nav class="app-bar-actions" aria-label="Actions">
      <div class="menu-anchor">
        <button type="button" class="icon-button" id="samples-button" aria-haspopup="menu" aria-expanded="false" aria-controls="samples-menu" title="Samples" aria-label="Load a sample response">
          <svg aria-hidden="true"><use href="#i-sparkles"></use></svg>
        </button>
        <div class="menu" id="samples-menu" role="menu" aria-labelledby="samples-button" hidden></div>
      </div>
      <button type="button" class="icon-button theme-toggle" id="theme-button" title="Switch to dark theme" aria-label="Switch to dark theme">
        <svg class="ic-dark" aria-hidden="true"><use href="#i-dark"></use></svg>
        <svg class="ic-light" aria-hidden="true"><use href="#i-light"></use></svg>
      </button>
    </nav>
  </header>

  <main class="layout">
    <section class="pane input-pane" aria-labelledby="input-title">
      <div class="card input-card">
        <div class="card-header">
          <div>
            <h2 id="input-title">Response</h2>
            <p class="subtitle">Paste a raw HTTP response</p>
          </div>
          <button type="button" class="icon-button" id="clear-button" title="Clear" aria-label="Clear the input" disabled>
            <svg aria-hidden="true"><use href="#i-delete"></use></svg>
          </button>
        </div>
        <div class="text-field">
          <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" wrap="off" placeholder=" "></textarea>
          <label for="input">Raw HTTP response</label>
        </div>
      </div>
    </section>

    <section class="pane results-pane" id="results" aria-labelledby="results-title" tabindex="-1">
      <h2 class="visually-hidden" id="results-title">Results</h2>
      <div id="results-root"></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="visually-hidden" id="announcer" aria-live="polite"></div>

  <script src="src/core/models.js"></script>
  <script src="src/core/sources.js"></script>
  <script src="src/core/fields.js"></script>
  <script src="src/core/parser.js"></script>
  <script src="src/core/csp.js"></script>
  <script src="src/core/profiles.js"></script>
  <script src="src/core/rules.js"></script>
  <script src="src/core/correlations.js"></script>
  <script src="src/core/engine.js"></script>
  <script src="src/ui/samples.js"></script>
  <script src="src/ui/app.js"></script>
</body>
</html>
