/*
 * Header Analyzer: interface styles after Google's Material Design 3.
 *
 * Colour comes from the M3 baseline tonal scheme (light and dark), expressed
 * as colour roles; severities are extra "custom colours" built the same way
 * (colour / container / on-container). Shapes, type scale, elevation and
 * state layers follow the M3 tokens. Severity is always also written as a
 * word, never carried by colour alone.
 */

:root {
  color-scheme: light;
  --md-primary: #6750a4;
  --md-on-primary: #ffffff;
  --md-primary-container: #eaddff;
  --md-on-primary-container: #21005d;
  --md-secondary-container: #e8def8;
  --md-on-secondary-container: #1d192b;
  --md-tertiary-container: #ffd8e4;
  --md-on-tertiary-container: #31111d;
  --md-error: #b3261e;
  --md-on-error: #ffffff;
  --md-error-container: #f9dedc;
  --md-on-error-container: #410e0b;
  --md-surface: #fef7ff;
  --md-on-surface: #1d1b20;
  --md-on-surface-variant: #49454f;
  --md-outline: #79747e;
  --md-outline-variant: #cac4d0;
  --md-surface-container-lowest: #ffffff;
  --md-surface-container-low: #f7f2fa;
  --md-surface-container: #f3edf7;
  --md-surface-container-high: #ece6f0;
  --md-surface-container-highest: #e6e0e9;
  --md-inverse-surface: #322f35;
  --md-inverse-on-surface: #f5eff7;
  --md-inverse-primary: #d0bcff;
  --md-logo-accent: #6750a4;

  /* Severity custom colours: colour / container / on-container */
  --sev-high: #b3261e;      --sev-high-c: #f9dedc;      --sev-high-on: #410e0b;
  --sev-medium: #8b5000;    --sev-medium-c: #ffdcbe;    --sev-medium-on: #2c1600;
  --sev-low: #6d5e00;       --sev-low-c: #f8e287;       --sev-low-on: #221b00;
  --sev-ok: #146c2e;        --sev-ok-c: #b7f1b9;        --sev-ok-on: #002107;

  --elev-1: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 3px 1px rgba(0, 0, 0, 0.15);
  --elev-2: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 6px 2px rgba(0, 0, 0, 0.15);
  --elev-3: 0 1px 3px rgba(0, 0, 0, 0.3), 0 4px 8px 3px rgba(0, 0, 0, 0.15);

  --font: Roboto, "Roboto Flex", "Google Sans Text", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --mono: "Roboto Mono", ui-monospace, "SF Mono", Menlo, "DejaVu Sans Mono", Consolas, monospace;
  --ease: cubic-bezier(0.2, 0, 0, 1);           /* M3 emphasized */
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --md-primary: #d0bcff;
    --md-on-primary: #381e72;
    --md-primary-container: #4f378b;
    --md-on-primary-container: #eaddff;
    --md-secondary-container: #4a4458;
    --md-on-secondary-container: #e8def8;
    --md-tertiary-container: #633b48;
    --md-on-tertiary-container: #ffd8e4;
    --md-error: #f2b8b5;
    --md-on-error: #601410;
    --md-error-container: #8c1d18;
    --md-on-error-container: #f9dedc;
    --md-surface: #141218;
    --md-on-surface: #e6e0e9;
    --md-on-surface-variant: #cac4d0;
    --md-outline: #938f99;
    --md-outline-variant: #49454f;
    --md-surface-container-lowest: #0f0d13;
    --md-surface-container-low: #1d1b20;
    --md-surface-container: #211f26;
    --md-surface-container-high: #2b2930;
    --md-surface-container-highest: #36343b;
    --md-inverse-surface: #e6e0e9;
    --md-inverse-on-surface: #322f35;
    --md-inverse-primary: #6750a4;
    --md-logo-accent: #d0bcff;
    --sev-high: #f2b8b5;      --sev-high-c: #8c1d18;      --sev-high-on: #f9dedc;
    --sev-medium: #ffb870;    --sev-medium-c: #6a3c00;    --sev-medium-on: #ffdcbe;
    --sev-low: #dbc66e;       --sev-low-c: #524600;       --sev-low-on: #f8e287;
    --sev-ok: #9cd49f;        --sev-ok-c: #005321;        --sev-ok-on: #b7f1b9;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --md-primary: #d0bcff;
  --md-on-primary: #381e72;
  --md-primary-container: #4f378b;
  --md-on-primary-container: #eaddff;
  --md-secondary-container: #4a4458;
  --md-on-secondary-container: #e8def8;
  --md-tertiary-container: #633b48;
  --md-on-tertiary-container: #ffd8e4;
  --md-error: #f2b8b5;
  --md-on-error: #601410;
  --md-error-container: #8c1d18;
  --md-on-error-container: #f9dedc;
  --md-surface: #141218;
  --md-on-surface: #e6e0e9;
  --md-on-surface-variant: #cac4d0;
  --md-outline: #938f99;
  --md-outline-variant: #49454f;
  --md-surface-container-lowest: #0f0d13;
  --md-surface-container-low: #1d1b20;
  --md-surface-container: #211f26;
  --md-surface-container-high: #2b2930;
  --md-surface-container-highest: #36343b;
  --md-inverse-surface: #e6e0e9;
  --md-inverse-on-surface: #322f35;
  --md-inverse-primary: #6750a4;
  --md-logo-accent: #d0bcff;
  --sev-high: #f2b8b5;      --sev-high-c: #8c1d18;      --sev-high-on: #f9dedc;
  --sev-medium: #ffb870;    --sev-medium-c: #6a3c00;    --sev-medium-on: #ffdcbe;
  --sev-low: #dbc66e;       --sev-low-c: #524600;       --sev-low-on: #f8e287;
  --sev-ok: #9cd49f;        --sev-ok-c: #005321;        --sev-ok-on: #b7f1b9;
}

/* Map each severity class onto three local variables, used by every component. */
.sev-high     { --c: var(--sev-high);     --cc: var(--sev-high-c);     --con: var(--sev-high-on); }
.sev-medium   { --c: var(--sev-medium);   --cc: var(--sev-medium-c);   --con: var(--sev-medium-on); }
.sev-low      { --c: var(--sev-low);      --cc: var(--sev-low-c);      --con: var(--sev-low-on); }
.sev-ok       { --c: var(--sev-ok);       --cc: var(--sev-ok-c);       --con: var(--sev-ok-on); }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--md-surface);
  color: var(--md-on-surface);
  font: 400 14px/20px var(--font);       /* body-medium */
  letter-spacing: 0.25px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
code { font-family: var(--mono); font-size: 0.92em; letter-spacing: 0; }
h1, h2, h3 { margin: 0; font-weight: 400; }
p { margin: 0; }
svg { fill: currentColor; }

:focus-visible { outline: 3px solid var(--md-primary); outline-offset: 2px; }

.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.visually-hidden {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip-link {
  position: absolute; left: 16px; top: -60px; z-index: 100;
  padding: 10px 24px; border-radius: 20px;
  background: var(--md-primary); color: var(--md-on-primary);
  font-weight: 500; text-decoration: none;
}
.skip-link:focus { top: 12px; }

/* State layer: the M3 hover/press overlay, in the content colour. */
.icon-button, .filled-button, .tonal-button, .filter-chip, .segmented button, .menu button,
.row > summary, .notes summary, .sources > summary {
  position: relative; isolation: isolate;
}
.icon-button::after, .filled-button::after, .tonal-button::after, .filter-chip::after, .segmented button::after,
.menu button::after, .row > summary::after, .notes summary::after, .sources > summary::after {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
  background: currentColor; opacity: 0; transition: opacity 0.15s linear; pointer-events: none;
}
:is(.icon-button, .filled-button, .tonal-button, .filter-chip, .segmented button, .menu button, .row > summary, .notes summary, .sources > summary):hover:not(:disabled)::after { opacity: 0.08; }
:is(.icon-button, .filled-button, .tonal-button, .filter-chip, .segmented button, .menu button, .row > summary, .notes summary, .sources > summary):focus-visible::after { opacity: 0.1; }
:is(.icon-button, .filled-button, .tonal-button, .filter-chip, .segmented button, .menu button, .row > summary, .notes summary, .sources > summary):active:not(:disabled)::after { opacity: 0.12; }

/* ---------------------------------------------------------- Top app bar */

.top-app-bar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 16px;
  min-height: 64px;
  padding: 8px max(8px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
  background: var(--md-surface);
  transition: background-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
}
.top-app-bar.scrolled { background: var(--md-surface-container); box-shadow: var(--elev-2); }
.app-bar-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
.app-bar-title h1 { font-size: 22px; line-height: 28px; letter-spacing: 0; }     /* title-large */
/* Light/dark switch: the icon shows the theme a click switches to. */
.theme-toggle .ic-light { display: none; }
:root[data-theme="dark"] .theme-toggle .ic-light { display: block; }
:root[data-theme="dark"] .theme-toggle .ic-dark { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .theme-toggle .ic-light { display: block; }
  :root:not([data-theme="light"]) .theme-toggle .ic-dark { display: none; }
}
.app-logo {
  display: grid; place-items: center; width: 36px; height: 40px; flex: none;
  color: var(--md-on-surface);
}
.app-logo svg { width: 34px; height: 25.5px; stroke: var(--md-logo-accent); }   /* the "value" stroke after "H:" inherits this */
.app-bar-actions { display: flex; align-items: center; gap: 0; margin-left: auto; }

.icon-button {
  display: inline-grid; place-items: center; width: 40px; height: 40px; flex: none;
  padding: 0; border: 0; border-radius: 50%;
  background: transparent; color: var(--md-on-surface-variant);
}
.icon-button svg { width: 24px; height: 24px; }
.icon-button:disabled { color: var(--md-on-surface); opacity: 0.38; }
.icon-button[aria-expanded="true"] { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
.icon-button.small { width: 32px; height: 32px; }
.icon-button.small svg { width: 18px; height: 18px; }

/* Segmented button */
.segmented { display: inline-flex; flex: none; height: 40px; }
.segmented button {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-width: 108px; padding: 0 16px;
  border: 1px solid var(--md-outline); background: transparent; color: var(--md-on-surface);
  font-size: 14px; font-weight: 500; line-height: 20px; letter-spacing: 0.1px;   /* label-large */
}
.segmented button:first-child { border-radius: 20px 0 0 20px; }
.segmented button:last-child { border-radius: 0 20px 20px 0; }
.segmented button + button { margin-left: -1px; }
.segmented button[aria-checked="true"] { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
.seg-check { width: 18px; height: 18px; display: none; }
.segmented button[aria-checked="true"] .seg-check { display: block; color: var(--md-primary); }

/* Menus */
.menu-anchor { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 30;
  min-width: 220px; max-width: 320px; padding: 8px 0;
  border-radius: 4px; background: var(--md-surface-container);
  box-shadow: var(--elev-2);
  transform-origin: top right; animation: menu-in 0.2s var(--ease);
}
@keyframes menu-in { from { opacity: 0; transform: scale(0.92, 0.6); } }
.menu button {
  display: flex; align-items: center; gap: 12px; width: 100%;
  min-height: 48px; padding: 0 16px 0 12px;
  border: 0; background: transparent; color: var(--md-on-surface);
  text-align: left; font-size: 14px; font-weight: 500; letter-spacing: 0.1px;
}
.menu button svg { width: 24px; height: 24px; flex: none; color: var(--md-on-surface-variant); }
.menu button:focus-visible { outline: none; }
.menu button.two-line { min-height: 56px; padding-top: 8px; padding-bottom: 8px; }
.menu .menu-detail { display: block; font-size: 12px; font-weight: 400; line-height: 16px; letter-spacing: 0.4px; color: var(--md-on-surface-variant); }

/* ----------------------------------------------------------------- Layout */

.layout {
  display: grid;
  grid-template-columns: minmax(340px, 5fr) minmax(0, 7fr);
  gap: 24px;
  max-width: 1480px; margin: 0 auto;
  padding: 8px max(24px, env(safe-area-inset-right)) 48px max(24px, env(safe-area-inset-left));
}
.input-pane { position: sticky; top: 80px; align-self: start; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.results-pane { min-width: 0; outline: none; }

.card { position: relative; border-radius: 12px; background: var(--md-surface-container-low); }

/* ------------------------------------------------------------------ Input */

.input-card { display: flex; flex-direction: column; padding: 16px; }
.card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
.card-header h2 { font-size: 22px; line-height: 28px; }
.subtitle { margin-top: 2px; font-size: 14px; line-height: 20px; color: var(--md-on-surface-variant); }

/* Outlined text field with a floating label */
.text-field { position: relative; }
#input {
  display: block; width: 100%;
  height: clamp(220px, calc(100vh - 400px), 620px);
  margin: 0; padding: 16px;
  border: 1px solid var(--md-outline); border-radius: 4px;
  outline: none; resize: vertical;
  background: transparent;
  font: 13px/20px var(--mono); letter-spacing: 0;
  tab-size: 4; white-space: pre; overflow: auto;
  transition: border-color 0.15s linear;
}
#input:hover { border-color: var(--md-on-surface); }
#input:focus { border: 2px solid var(--md-primary); padding: 15px; }
.text-field label {
  position: absolute; left: 12px; top: 16px; padding: 0 4px;
  background: var(--md-surface-container-low); color: var(--md-on-surface-variant);
  font-size: 16px; line-height: 20px; letter-spacing: 0.5px;
  pointer-events: none; transform-origin: left top;
  transition: transform 0.2s var(--ease), color 0.2s linear;
}
#input:focus + label, #input:not(:placeholder-shown) + label { transform: translateY(-24px) scale(0.75); }
#input:focus + label { color: var(--md-primary); }





/* --------------------------------------------------------------- Buttons */

.filled-button {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 24px; border: 0; border-radius: 20px;
  font-size: 14px; font-weight: 500; line-height: 20px; letter-spacing: 0.1px;
}
.filled-button { background: var(--md-primary); color: var(--md-on-primary); padding-left: 16px; transition: box-shadow 0.15s linear; }
.filled-button:hover { box-shadow: var(--elev-1); }
.filled-button svg { width: 18px; height: 18px; }
/* M3 filled tonal button: a secondary action that still stands out. */
.tonal-button {
  display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px;
  border: 0; border-radius: 20px; background: var(--md-secondary-container); color: var(--md-on-secondary-container);
  font-size: 14px; font-weight: 500; line-height: 20px; letter-spacing: 0.1px;
}
.tonal-button svg { width: 18px; height: 18px; fill: currentColor; }
.tonal-button .trailing { margin-right: -4px; transition: transform 0.2s var(--ease); }
.tonal-button[aria-expanded="true"] .trailing { transform: rotate(180deg); }

/* ---------------------------------------------------------------- Results */

#results-root { display: flex; flex-direction: column; gap: 16px; }

.empty-state {
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px;
  min-height: 440px; justify-content: center; padding: 40px 24px;
}
.empty-icon {
  display: grid; place-items: center; width: 96px; height: 96px; margin-bottom: 8px;
  border-radius: 28px; background: var(--md-primary-container); color: var(--md-on-primary-container);
}
.empty-icon svg { width: 48px; height: 48px; }
.empty-state h3 { font-size: 24px; line-height: 32px; }                 /* headline-small */
.empty-state p { max-width: 420px; font-size: 14px; color: var(--md-on-surface-variant); }
.empty-state .filled-button { margin-top: 12px; }
.empty-state.error .empty-icon { background: var(--md-error-container); color: var(--md-on-error-container); }
.empty-state details { max-width: 100%; text-align: left; }
.empty-state details summary { cursor: pointer; font-weight: 500; color: var(--md-primary); }
.empty-state pre { max-width: 100%; overflow: auto; margin: 8px 0 0; padding: 12px; border-radius: 8px; background: var(--md-surface-container-highest); font: 11px/1.5 var(--mono); }

.row { scroll-margin-top: 88px; }

/* Notes */
.notes { overflow: hidden; }
.notes summary {
  display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 0 16px;
  list-style: none; cursor: pointer; font-size: 16px; line-height: 24px; letter-spacing: 0.15px; font-weight: 500;
  border-radius: 12px;
}
.notes summary::-webkit-details-marker { display: none; }
.notes summary .lead { width: 24px; height: 24px; color: var(--md-primary); flex: none; }
.notes summary .chev { width: 24px; height: 24px; margin-left: auto; color: var(--md-on-surface-variant); transition: transform 0.2s var(--ease); }
.notes[open] summary .chev { transform: rotate(180deg); }
.notes ul { margin: 0; padding: 0 24px 16px 56px; color: var(--md-on-surface-variant); }
.notes li + li { margin-top: 6px; }

/* Search bar and filter chips */
.filter-bar { position: relative; z-index: 5; display: flex; flex-direction: column; gap: 12px; }
.search-bar {
  display: flex; align-items: center; gap: 16px; height: 56px; padding: 0 16px;
  border-radius: 28px; background: var(--md-surface-container-high); cursor: text;
}
.search-bar:focus-within { box-shadow: 0 0 0 2px var(--md-primary); }
.search-bar svg { width: 24px; height: 24px; flex: none; color: var(--md-on-surface-variant); }
.search-bar input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; font-size: 16px; letter-spacing: 0.5px; }
.search-bar input::placeholder { color: var(--md-on-surface-variant); }
.search-bar input::-webkit-search-cancel-button { filter: grayscale(1); }

.chip-set { display: flex; flex-wrap: wrap; gap: 8px; }
.filter-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.copy-anchor { margin-left: auto; }
.menu button:disabled { color: var(--md-on-surface); opacity: 0.38; cursor: default; }

/* Manual copy dialog (M3 basic dialog) */
.manual-copy {
  width: min(560px, calc(100vw - 32px)); padding: 24px; border: 0; border-radius: 28px;
  background: var(--md-surface-container-high); color: var(--md-on-surface); box-shadow: var(--elev-3);
}
.manual-copy::backdrop { background: rgba(0, 0, 0, 0.32); }
.manual-copy h3 { margin: 0 0 8px; font-size: 24px; line-height: 32px; font-weight: 400; }
.manual-copy .subtitle { margin: 0 0 16px; }
.manual-copy-text {
  width: 100%; resize: vertical; padding: 12px; border: 1px solid var(--md-outline); border-radius: 4px;
  background: var(--md-surface); color: var(--md-on-surface); font: 13px/1.5 var(--mono);
}
.dialog-actions { display: flex; justify-content: flex-end; margin-top: 20px; }
.filter-chip {
  display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 16px;
  border: 1px solid var(--md-outline); border-radius: 8px;
  background: transparent; color: var(--md-on-surface-variant);
  font-size: 14px; font-weight: 500; letter-spacing: 0.1px;
}
.filter-chip .chip-check { display: none; width: 18px; height: 18px; }
.filter-chip[aria-checked="true"] { padding-left: 8px; border-color: transparent; background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
.filter-chip[aria-checked="true"] .chip-check { display: block; color: var(--md-primary); }

/* Lists */
.result-section { display: flex; flex-direction: column; gap: 8px; }
.section-header {
  display: flex; align-items: center; gap: 8px; padding: 8px 16px 0;
  font-size: 14px; font-weight: 500; line-height: 20px; letter-spacing: 0.1px; color: var(--md-primary);  /* title-small */
}
.section-count {
  display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px;
  border-radius: 10px; background: var(--md-primary-container); color: var(--md-on-primary-container);
  font-size: 11px; font-weight: 500;
}
.list { overflow: hidden; padding: 8px 0; }
.row + .row { border-top: 1px solid var(--md-outline-variant); }
.row > summary {
  display: grid; grid-template-columns: 40px minmax(0, 1fr) auto 24px; align-items: center; gap: 16px;
  min-height: 72px; padding: 8px 16px;
  list-style: none; cursor: pointer;
}
.row > summary::-webkit-details-marker { display: none; }
.avatar {
  display: grid; place-items: center; width: 40px; height: 40px;
  border-radius: 50%; background: var(--cc); color: var(--con);
}
.avatar svg { width: 24px; height: 24px; }
.row-text { min-width: 0; }
.row-name { font-size: 16px; line-height: 24px; letter-spacing: 0.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-value { font: 13px/20px var(--mono); letter-spacing: 0; color: var(--md-on-surface-variant); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-value.absent { font-family: var(--font); font-size: 14px; letter-spacing: 0.25px; font-style: italic; }
.row-chevron { width: 24px; height: 24px; color: var(--md-on-surface-variant); transition: transform 0.2s var(--ease); }
.row[open] > summary .row-chevron { transform: rotate(180deg); }

/* Severity chips */
.badge {
  display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px;
  border: 1px solid transparent; border-radius: 8px;
  background: var(--cc); color: var(--con);
  font-size: 12px; font-weight: 500; line-height: 16px; letter-spacing: 0.5px; white-space: nowrap;
}
.badge.contingent { background: transparent; border-color: var(--c); color: var(--c); }
.badge-icon { width: 14px; height: 14px; }
.row-badges { display: inline-flex; align-items: center; gap: 6px; }
.to-confirm-marker { --c: var(--md-on-surface-variant); padding: 0 6px; gap: 2px; }

.row-detail { display: flex; flex-direction: column; gap: 16px; padding: 4px 24px 24px 72px; }
.value-block {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 8px 8px 16px; border-radius: 8px; background: var(--md-surface-container-highest);
}
.value-block code { flex: 1; min-width: 0; padding: 6px 0; font-size: 13px; line-height: 20px; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
.value-block.absent { padding: 14px 16px; color: var(--md-on-surface-variant); font-style: italic; }

.finding { display: flex; flex-direction: column; gap: 8px; }
.finding + .finding { padding-top: 16px; border-top: 1px solid var(--md-outline-variant); }
.finding-head { display: flex; align-items: flex-start; gap: 12px; }
.finding-head .badge { flex: none; }
.finding.note .finding-title { font-weight: 400; }
.note-icon { width: 20px; height: 20px; flex: none; color: var(--md-on-surface-variant); margin-top: 2px; }
.finding-title { font-size: 16px; font-weight: 500; line-height: 24px; letter-spacing: 0.15px; overflow-wrap: anywhere; }   /* title-medium */
.finding-desc { font-size: 14px; line-height: 20px; color: var(--md-on-surface-variant); overflow-wrap: anywhere; }
.callout {
  display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 12px;
  padding: 12px 16px; border-radius: 12px; overflow-wrap: anywhere;
}
.callout > svg { width: 20px; height: 20px; margin-top: 2px; }
.callout-label { display: block; margin-bottom: 2px; font-size: 12px; font-weight: 500; line-height: 16px; letter-spacing: 0.5px; }
.callout.verify { background: var(--md-tertiary-container); color: var(--md-on-tertiary-container); }
.callout.rec { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }

.sources { font-size: 13px; line-height: 18px; color: var(--md-on-surface-variant); }
.sources > summary {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px 4px 4px; margin-left: -4px;
  border-radius: 8px; cursor: pointer; list-style: none; font-weight: 500; letter-spacing: 0.1px;
}
.sources > summary::-webkit-details-marker { display: none; }
.sources > summary:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }
.sources > summary .chev { width: 18px; height: 18px; transition: transform 150ms; }
.sources[open] > summary .chev { transform: rotate(180deg); }
.sources ol { display: flex; flex-direction: column; gap: 10px; margin: 8px 0 0; padding-left: 24px; }
.source-link {
  display: inline-flex; align-items: center; gap: 4px; color: var(--md-primary);
  font-weight: 500; text-decoration: none; overflow-wrap: anywhere;
}
.source-link:hover { text-decoration: underline; }
.source-link:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; border-radius: 2px; }
.source-open { width: 14px; height: 14px; flex: none; }
.source-quote { display: block; margin-top: 2px; font-style: italic; overflow-wrap: anywhere; }

.no-match { padding: 24px; text-align: center; color: var(--md-on-surface-variant); }

/* ---------------------------------------------------------------- Snackbar */

.toast {
  position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 50;
  transform: translateX(-50%);
  min-width: 288px; max-width: min(560px, calc(100vw - 32px));
  padding: 14px 16px; border-radius: 4px;
  background: var(--md-inverse-surface); color: var(--md-inverse-on-surface);
  font-size: 14px; line-height: 20px;
  box-shadow: var(--elev-3);
  animation: snack-in 0.25s var(--ease);
}
@keyframes snack-in { from { opacity: 0; transform: translate(-50%, 16px); } }

/* ------------------------------------------------------------- Responsive */

/* M3 compact / medium window classes */
@media (max-width: 839px) {
  .layout { grid-template-columns: minmax(0, 1fr); padding: 8px 16px 32px; gap: 16px; }
  .input-pane { position: static; }
  .top-app-bar { flex-wrap: wrap; row-gap: 4px; padding-bottom: 12px; }
  .top-app-bar .segmented { order: 3; width: 100%; }
  .top-app-bar .segmented button { flex: 1; min-width: 0; }
  #input { height: 240px; }
  .row > summary { grid-template-columns: 40px minmax(0, 1fr) 24px; }
  .row > summary .row-badges { grid-column: 2; grid-row: 2; justify-self: start; }
  .row > summary .row-chevron { grid-column: 3; grid-row: 1 / span 2; }
  .row-detail { padding: 4px 16px 20px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

@media print {
  .top-app-bar, .input-pane, .filter-bar, .skip-link, .toast { display: none !important; }
  .layout { display: block; padding: 0; }
  .row-detail { display: flex !important; }
}

/* Decision on a finding to confirm */
.filter-chip[aria-pressed="true"] { padding-left: 8px; border-color: transparent; background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
.filter-chip[aria-pressed="true"] .chip-check { display: block; color: var(--md-primary); }
.finding.decided-excluded :is(.finding-head, .finding-desc, .callout) { opacity: 0.6; }
.finding.decided-excluded .finding-title { text-decoration: line-through; }

  <script>
/* src/core/models.js */
/*
 * Header Analyzer: data types shared by the engine and the interface.
 *
 * Every file in src/ is a classic script that registers itself on the
 * `HeaderAnalyzer` global. Classic scripts load from file:// in every browser,
 * which ES modules do not, and the same files run unchanged under Node for
 * the test suite (tests/load.js).
 */
(function (HL) {
  'use strict';

  // Ordered: comparisons (`>`, Math.max) rely on it throughout the engine.
  /*
   * Three severities, and OK. A finding with a severity is a deviation from an
   * OWASP or ASVS recommendation; OK means the check passed. An OK finding may
   * still carry a description (a fact worth explaining, e.g. 'unsafe-inline'
   * kept as a fallback next to a nonce) or a check to run (the nonce must change
   * on every response): a note, never counted as a problem.
   *
   * Grading rules (RULES.md has the full rationale and sources):
   *   - anchored on OWASP ZAP's alert risks, arbitrated by OWASP ASVS 5.0 and
   *     Mozilla HTTP Observatory, on the OWASP Risk Rating scale;
   *   - a value never weighs more than the header's absence, unless it grants
   *     more than the browser default; a value a browser ignores weighs as absence;
   *   - "to confirm" never inflates: the severity is what the response shows.
   */
  const Severity = Object.freeze({
    OK: 0,
    LOW: 1,
    MEDIUM: 2,
    HIGH: 3,
  });

  const SEVERITY_NAMES = Object.freeze(['OK', 'LOW', 'MEDIUM', 'HIGH']);

  /**
   * What kind of problem a finding is, for the one-line findings list
   * (`<Header>: <status>. <brief>.`):
   *   Missing        the header is not present;
   *   Misconfigured  it is present but not configured securely;
   *   Duplicated     it is returned more than once;
   *   Deprecated     it uses an obsolete or no longer recommended feature.
   * NONE marks a finding that states a fact rather than a problem (a fallback
   * kept for old browsers, a note about another header); it is never listed.
   */
  const Status = Object.freeze({
    MISSING: 'Missing',
    MISCONFIGURED: 'Misconfigured',
    DUPLICATED: 'Duplicated',
    DEPRECATED: 'Deprecated',
    NONE: '',
  });

  /**
   * `severity` is what the finding is worth **if it applies** to this target.
   *
   * Whether it applies is a separate question, and for some checks the response
   * cannot settle it. Those findings carry `verify`: the check that settles it,
   * and what each outcome means. An empty `verify` is the claim that the
   * response is enough on its own. A finding therefore has either `verify` or
   * `recommendation`, never both: until the check is done there is nothing to
   * recommend.
   *
   * `sources` are citation ids (src/core/sources.js): the exact passages that
   * back what the finding says.
   */
  function finding(header, severity, title, opts) {
    const o = opts || {};
    const sources = Object.freeze([...(o.sources || [])]);
    if (HL.sources) for (const id of sources) HL.sources.cite(id);   // an unknown id throws
    return {
      header: header,
      severity: severity,
      title: title,
      description: o.description || '',
      recommendation: o.recommendation || '',
      verify: o.verify || '',
      // `brief` is the short clause after the status in the findings list.
      status: 'status' in o ? o.status : Status.MISCONFIGURED,
      brief: o.brief || '',
      sources,
    };
  }

  /** A problem the response cannot settle on its own (an OK note may carry a check too). */
  function isContingent(f) {
    return f.verify !== '' && f.severity > Severity.OK;
  }

  /** Whether a finding says something specific enough to stand on its own. */
  function isIssue(severity) {
    return severity > Severity.OK;
  }

  function worstSeverity(result) {
    let worst = Severity.OK;
    for (const f of result.findings) if (f.severity > worst) worst = f.severity;
    return worst;
  }

  /** Nothing settled reaches this result's worst severity on its own. */
  function resultIsContingent(result) {
    if (result.findings.length === 0) return false;
    const worst = worstSeverity(result);
    return result.findings.every((f) => f.severity !== worst || isContingent(f));
  }

  HL.models = Object.freeze({
    Severity,
    SEVERITY_NAMES,
    Status,
    finding,
    isContingent,
    isIssue,
    worstSeverity,
    resultIsContingent,
  });
})(globalThis.HeaderAnalyzer = globalThis.HeaderAnalyzer || {});

/* src/core/sources.js */
/*
 * Header Analyzer: the sources behind every claim.

    return !lower.startsWith("'") && !SCHEME_SOURCE.test(lower) && lower !== '*';
  }

  /** Levenshtein distance, for suggesting the directive a typo meant. */
  function distance(a, b) {
    const dp = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) dp[0][j] = j;
    for (let i = 1; i <= a.length; i++) {
      for (let j = 1; j <= b.length; j++) {
        dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1,
          dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
    }
    return dp[a.length][b.length];
  }

  function suggestion(name) {
    let best = null;
    let bestD = 3;
    for (const known of DIRECTIVES) {
      const d = distance(name, known);
      if (d < bestD) { best = known; bestD = d; }
    }
    return best;
  }

  // ---------------------------------------------------------------------------
  // Evaluation of one policy
  // ---------------------------------------------------------------------------

  /** Collects findings keyed by title, so two routes to one problem report it once. */
  class Collector {
    constructor() { this.map = new Map(); }
    add(severity, title, opts, absence) {
      if (this.map.has(title)) return;
      const f = finding(H, severity, title, opts);
      if (absence) Object.defineProperty(f, 'absence', { value: true, enumerable: false });
      this.map.set(title, f);
    }
    list() { return [...this.map.values()]; }
  }

  /**
   * How a finding names the directive it is about: the directive that actually
   * applied, marked when it was reached through default-src. script-src-elem and
   * script-src-attr usually both resolve to script-src, and then share one title,
   * so a weakness reached by both routes is reported once.
   */
  function label(family, eff) {
    return eff.name === 'default-src' ? `${family} (from default-src)` : eff.name;
  }

  function inlineState(lower) {
    const hasNonce = lower.some((t) => t.startsWith("'nonce-"));
    const hasHash = lower.some((t) => HASH.test(t));
    return {
      hasNonce,
      hasHash,
      strictDynamic: lower.includes("'strict-dynamic'"),
      unsafeInline: lower.includes("'unsafe-inline'"),
    };
  }

  function checkStructure(policy, out) {
    for (const [name, d] of policy.directives) {
      if (!ALL_NAMES.has(name)) {
        const guess = suggestion(name);
        out.add(Severity.LOW, `Unrecognised directive '${name}' is ignored`, {
          sources: ['csp3-registry', 'zap-10055-3'],
          brief: `Unknown directive ${name}`,
          description: `'${name}' is not a CSP directive, so browsers skip it and whatever it was written to restrict is not restricted.`
            + (guess ? ` It looks like a misspelling of '${guess}'.` : ''),
          recommendation: guess ? `Rename it to '${guess}'.` : `Remove '${name}', or replace it with the directive that was meant.`,
        });
      }
      for (const t of d.lower) {
        if (ALL_NAMES.has(t)) {
          out.add(Severity.LOW, `Possible missing semicolon: '${t}' inside '${name}'`, {
            sources: ['csp3-split', 'zap-10055-3'],
            brief: `Missing semicolon before ${t}`,
            description: `'${t}' is a directive name but appears as a source of '${name}', which usually means a ';' is missing. A browser reads it as a host called '${t}', and the directive that was meant is not in the policy at all.`,
            recommendation: `Separate '${name}' and '${t}' with a semicolon.`,
          });
        } else if (UNQUOTED_KEYWORDS.has(t)) {
          out.add(Severity.LOW, `Keyword '${t}' in '${name}' is missing its single quotes`, {
            sources: ['csp3-keywords', 'zap-10055-3'],
            brief: `Unquoted keyword ${t} in ${name}`,
            description: `Without single quotes '${t}' is a host name, not a keyword, so the policy does not do what it says: the keyword's effect is not applied, and a host called '${t}' is allowed instead.`,
            recommendation: `Write it as '${"'"}${t}${"'"}'.`,
          });
        } else if (UNQUOTED_NONCE_HASH.test(t)) {
          out.add(Severity.LOW, `Nonce or hash in '${name}' is missing its single quotes`, {
            sources: ['csp3-nonce-grammar', 'zap-10055-3'],
            brief: `Unquoted nonce or hash in ${name}`,
            description: `'${t}' without single quotes is read as a host name, so the scripts or styles it was meant to allow are blocked.`,
            recommendation: `Write it as '${"'"}${d.tokens[d.lower.indexOf(t)]}${"'"}'.`,
          });
        } else if (t.startsWith("'") && !KEYWORDS.has(t) && !NONCE.test(t) && !HASH.test(t)) {
          out.add(Severity.LOW, `Unrecognised source expression ${t} in '${name}' is ignored`, {
            sources: ['csp3-keywords', 'zap-10055-3'],
            brief: `Invalid source ${t} in ${name}`,
            description: `${t} is quoted like a keyword but is not one, nor a valid nonce or hash, so browsers skip it.`,
            recommendation: 'Check the spelling against the keywords CSP defines.',
          });
        }
      }
      if (d.lower.includes("'none'") && d.lower.length > 1) {
        out.add(Severity.LOW, `'none' in '${name}' is combined with other sources`, {
          sources: ['csp3-none'],
          brief: `'none' combined with other sources in ${name}`,
          description: `'none' only means "nothing" when it is the only source. Next to other sources it is ignored, and the directive allows exactly what the other sources allow.`,
          recommendation: `Remove 'none' from '${name}', or remove the other sources.`,
        });
      }
    }
    for (const dup of policy.duplicates) {
      out.add(Severity.LOW, `Directive '${dup.name}' appears more than once; only the first is applied`, {
        sources: ['csp3-dup', 'zap-10055-3'],
        brief: `${dup.name} is declared twice; only the first applies`,
        description: `CSP3 §2.2.1 skips a directive whose name has already been seen, so '${(dup.name + ' ' + dup.value).trim()}' is ignored. If it was added to tighten the policy, it does not.`,
        recommendation: `Merge the two '${dup.name}' directives into one.`,
      });
    }
    for (const name of policy.nonAscii) {
      out.add(Severity.LOW, `Directive '${name}' contains non-ASCII characters and is ignored`, {
        sources: ['csp3-ascii'],
        brief: `Non-ASCII characters in ${name}`,
        description: 'CSP3 §2.2.1 skips any directive that is not pure ASCII: often the result of a curly quote or a non-breaking space pasted from a document.',
        recommendation: 'Retype the directive with plain ASCII quotes and spaces.',
      });
    }
    for (const [name, [why, refs]] of RETIRED) {
      if (policy.directives.has(name)) {
        out.add(Severity.LOW, `Obsolete CSP directive: ${name}`, {
          status: Status.DEPRECATED, brief: `Obsolete directive ${name}`,
          description: why,
          sources: refs,
          recommendation: `Remove '${name}'.`,
        });
      }
    }
  }

  function checkScripts(policy, out) {
    if (!policy.directives.has('script-src') && !policy.directives.has('default-src')
        && !policy.directives.has('script-src-elem')) {
      out.add(Severity.MEDIUM, 'Missing script-src and default-src', {
        sources: ['cspe-script', 'csp3-default'],
        brief: 'Scripts are not restricted',
        description: 'With neither directive, the policy places no restriction on which scripts run, so it offers no protection against XSS.',
        recommendation: "Add script-src with a per-response nonce and 'strict-dynamic', or at minimum default-src 'self'.",
      }, true);
    }

    const elem = effective(policy, 'script-src-elem');
    const attr = effective(policy, 'script-src-attr');
    const evalList = effective(policy, 'script-src');
    const upgrades = policy.directives.has('upgrade-insecure-requests');

    if (elem) checkScriptElements(label('script-src', elem), elem, upgrades, out);
    if (attr) checkInline(label('script-src', attr), attr, 'script', out);
    if (evalList && evalList.lower.includes("'unsafe-eval'")) {
      out.add(Severity.MEDIUM, `${label('script-src', evalList)}: 'unsafe-eval'`, {
        sources: ['zap-10055-10', 'obs-csp-eval'],
        brief: `'unsafe-eval' allowed for scripts in ${evalList.name}`,
        description: "Lets script turn strings into code with eval(), new Function(), setTimeout(string) and similar APIs, so an injection into any string that reaches them becomes code execution. 'strict-dynamic' does not switch it off.",
        recommendation: "Remove 'unsafe-eval' and refactor the code that needs it. If only WebAssembly needs it, 'wasm-unsafe-eval' is the narrow replacement.",
      });
    }
  }

  function checkInline(lbl, eff, kind, out, leak) {
    const st = inlineState(eff.lower);
    if (!st.unsafeInline) return;
    const disabled = st.hasNonce || st.hasHash || (kind === 'script' && st.strictDynamic);
    if (disabled) {
      out.add(Severity.OK, `${lbl}: 'unsafe-inline' is a fallback for old browsers`, {
        sources: ['csp3-inline-nonce', 'csp3-inline-sd', 'strictcsp-fallback'],
        status: Status.NONE,
        description: `A ${st.hasNonce ? 'nonce' : st.hasHash ? 'hash' : "'strict-dynamic'"} in the same list switches 'unsafe-inline' off in every browser that supports CSP Level 2 or later (CSP3 §6.7.3.2). It only takes effect in browsers too old to understand the rest of the list: the documented backwards-compatible pattern.`,
      });
      return;
    }
    if (kind === 'script') {
      out.add(Severity.MEDIUM, `${lbl}: 'unsafe-inline'`, {
        brief: `'unsafe-inline' allowed for scripts in ${eff.name}`,
        description: 'Any inline <script> block and any event-handler attribute runs, so an HTML injection anywhere on the page is code execution. This removes most of what a CSP protects against.',
        sources: ['zap-10055-5', 'obs-csp-inline'],
        recommendation: "Remove 'unsafe-inline' and allow the scripts you need with a per-response nonce or a hash, plus 'strict-dynamic'.",
      });
    } else if (leak) {
      out.add(Severity.MEDIUM, `${lbl}: 'unsafe-inline'`, {
        sources: ['ps-css-csp', 'ps-css-attr', 'csp3-exfil', 'zap-10055-6'],
        brief: `Inline styles allowed and ${leak.split(' ')[0]} reaches any origin`,
        description: `Any inline style block or style attribute is applied, so an HTML injection can run CSS even where script is blocked. Attribute selectors read values out of the page character by character (CSRF tokens, prefilled form fields, hidden inputs), and each match loads a background image or a font from the attacker's server, which ${leak} allows. The injection becomes theft of those values without a line of script.`,
        recommendation: `Allow inline styles with a nonce or a hash, or move them into stylesheets. Restricting ${leak.split(' ')[0]} (default-src 'self' does it) closes the channel even before that.`,
      });
    } else {
      out.add(Severity.LOW, `${lbl}: 'unsafe-inline'`, {
        brief: `'unsafe-inline' allowed for styles in ${eff.name}`,
        description: 'Any inline style block or style attribute is applied, so an HTML injection can restyle the page: hiding content or overlaying a fake message on the real site. Reading values out of the page with CSS would need a background image or a font from another origin, and this policy\'s img-src and font-src do not allow one.',
        sources: ['zap-10055-6', 'obs-csp-style', 'ps-css-attr', 'csp3-exfil'],
        recommendation: 'Allow inline styles with a nonce or a hash, or move them into stylesheets.',
      });
    }
  }

  function checkScriptElements(lbl, eff, upgrades, out) {
    const st = inlineState(eff.lower);
    checkInline(lbl, eff, 'script', out);

    if (st.strictDynamic && !st.hasNonce && !st.hasHash) {
      out.add(Severity.OK, `${lbl}: 'strict-dynamic' without a nonce or hash blocks every script`, {
        sources: ['csp3-sd-ignores'],
        status: Status.NONE,
        description: "'strict-dynamic' switches off the allowlist and 'unsafe-inline', and trusts only scripts already trusted through a nonce or a hash. With neither, no script can run. That is not a weakness, but it is probably not what was meant.",
        recommendation: "Add a per-response 'nonce-…' (or the hashes of the inline scripts) to the same list.",
      });
    }

    if (eff.lower.includes("'unsafe-hashes'")) {
      if (st.hasHash) {
        out.add(Severity.LOW, `${lbl}: 'unsafe-hashes'`, {
          sources: ['csp3-unsafe-hashes', 'zap-10055-7'],
          brief: `'unsafe-hashes' allowed in ${eff.name}`,
          description: "Lets event-handler attributes and javascript: URLs run when their text matches a hash. An attacker who can inject markup can reuse any allowed handler on an element of their choosing.",
          recommendation: 'Replace inline event handlers with addEventListener, then remove it.',
        });
      } else {
        out.add(Severity.OK, `${lbl}: 'unsafe-hashes' has no effect without a hash`, {
          sources: ['csp3-unsafe-hashes'],
          status: Status.NONE,
          description: "'unsafe-hashes' only widens what hashes match; with no hash in the list it allows nothing.",
          recommendation: "Remove 'unsafe-hashes'.",
        });
      }
    }

    for (const t of eff.lower) {
      const m = NONCE.exec(t);
      if (m && m[1].replace(/=+$/, '').length < 22) {
        out.add(Severity.LOW, `${lbl}: nonce is shorter than 128 bits`, {
          sources: ['csp3-nonce-128'],
          brief: 'Nonce shorter than 128 bits',
          description: `The nonce '${m[1]}' has ${m[1].replace(/=+$/, '').length} characters. CSP3 asks for at least 128 bits of cryptographically random data, which is 22 base64 characters; a short one can be guessed.`,
          recommendation: 'Generate at least 16 random bytes per response and base64-encode them.',
        });
      }
    }
    if (st.hasNonce) {
      out.add(Severity.OK, `${lbl}: the nonce must change on every response`, {
        sources: ['csp3-nonce-unique'],
        status: Status.NONE,
        description: 'A nonce works only if an attacker cannot know it in advance. One that is fixed, cached with the page, or reused across responses can be copied straight into an injected <script nonce=…>, and the policy then allows the injection: no better than \'unsafe-inline\'. One saved response cannot show which it is.',
        verify: 'Request the same URL twice (with any cache bypassed) and compare the nonce values. If they differ, there is nothing here. If they are the same, this stands: the nonce is predictable and the policy can be bypassed by anyone who has seen it.',
      });
    }

    if (st.strictDynamic && (st.hasNonce || st.hasHash)) {
      const ignored = eff.tokens.filter((t, k) => {
        const l = eff.lower[k];
        return l === "'self'" || l === '*' || SCHEME_SOURCE.test(l) || isHostSource(l);
      });
      if (ignored.length) {
        out.add(Severity.OK, `${lbl}: allowlist entries are ignored under 'strict-dynamic'`, {
          sources: ['csp3-sd-ignores', 'strictcsp-https'],
          status: Status.NONE,
          description: `With 'strict-dynamic' and a ${st.hasNonce ? 'nonce' : 'hash'}, browsers that support CSP3 ignore ${ignored.join(' ')}: only scripts trusted through the ${st.hasNonce ? 'nonce' : 'hash'}, and the scripts those load, can run. The entries only matter to older browsers, which is how Google's recommended strict policy keeps them working.`,
        });
      }
      return;
    }

    for (let k = 0; k < eff.lower.length; k++) {
      const t = eff.lower[k];
      const raw = eff.tokens[k];
      if (t === '*' || t === 'http:') {
        out.add(Severity.MEDIUM, `${lbl}: overly broad source '${raw}'`, {
          sources: ['cspe-wildcard', 'cspe-schemes', 'zap-10055-4'],
          brief: `Scripts allowed from ${raw}`,
          description: `'${raw}' allows scripts from any ${t === '*' ? 'web' : 'plain-HTTP'} origin, including one the attacker owns, so an HTML injection can load arbitrary script.`,
          recommendation: "Replace it with a nonce and 'strict-dynamic', or with the exact origins scripts come from.",
        });
      } else if (t === 'https:') {
        out.add(Severity.MEDIUM, `${lbl}: overly broad source 'https:'`, {
          sources: ['cspe-schemes'],
          brief: 'Scripts allowed from any HTTPS origin',
          description: "'https:' allows scripts from every HTTPS origin, including one the attacker registers for a few euros.",
          recommendation: "Replace it with a nonce and 'strict-dynamic', or with the exact origins scripts come from.",
        });
      } else if (t === 'data:') {
        out.add(Severity.MEDIUM, `${lbl}: 'data:' URI scheme`, {
          sources: ['cspe-schemes'],
          brief: 'Scripts allowed from data: URIs',
          description: "An injected <script src=\"data:text/javascript,…\"> carries its own code, so 'data:' is as good as 'unsafe-inline' to an attacker.",
          recommendation: "Remove 'data:'.",
        });
      } else if (t === 'blob:' || t === 'filesystem:') {
        out.add(Severity.LOW, `${lbl}: '${t}' URI scheme`, {
          sources: ['csp3-schemes'],
          brief: `Scripts allowed from ${t} URIs`,
          description: `Script that can create a ${t.slice(0, -1)} URL, or an injection that can reach code that does, can run arbitrary code through it.`,
          recommendation: `Remove '${t}' unless the application really loads scripts from it.`,
        });
      } else if (isHostSource(t)) {
        checkHost(lbl, raw, t, upgrades, out);
      }
    }
  }

  function checkHost(lbl, raw, t, upgrades, out) {
    const { host, wildcard } = hostOf(t);
    if (wildcard && (!host.includes('.') || MULTI_LABEL_SUFFIXES.has(host))) {
      out.add(Severity.MEDIUM, `${lbl}: wildcard over a whole top-level domain '${raw}'`, {
        sources: ['csp3-wildcard'],
        brief: `Scripts allowed from ${raw}`,
        description: `'${raw}' allows scripts from every domain under .${host}, including any the attacker registers.`,
        recommendation: `Replace '${raw}' with the specific hosts scripts come from.`,
      });
      return;
    }
    if (wildcard && BYPASS_BASES.has(host)) {
      out.add(Severity.MEDIUM, `${lbl}: known CSP bypass via wildcard '${raw}'`, {
        sources: ['cspe-bypass', 'csp3-wildcard'],
        brief: `Scripts allowed from bypassable hosts ${raw}`,
        description: `'${raw}' covers subdomains of ${host} that host JSONP endpoints or old AngularJS builds, either of which runs attacker-chosen code under this policy.`,
        recommendation: "Use a nonce with 'strict-dynamic' instead of allowlisting CDNs.",
      });
    } else if (wildcard && USER_CONTENT_BASES.has(host)) {
      out.add(Severity.MEDIUM, `${lbl}: wildcard over a domain anyone can publish on '${raw}'`, {
        sources: ['csp3-wildcard'],
        brief: `Scripts allowed from user-content hosts ${raw}`,
        description: `Anyone can create a site under ${host}, so '${raw}' lets an attacker host a script there and load it through an HTML injection.`,
        recommendation: `Name the exact subdomain of ${host} that serves your scripts.`,
      });
    } else if (!wildcard && BYPASS_HOSTS.has(host)) {
      out.add(Severity.MEDIUM, `${lbl}: known CSP bypass host '${host}'`, {
        sources: ['cspe-bypass'],
        brief: `Scripts allowed from bypassable host ${host}`,
        description: `${host} serves attacker-chosen code: a JSONP endpoint that runs any callback, or any version of any library (old AngularJS evaluates template expressions). Allowlisting it therefore lets an HTML injection run arbitrary script.`,
        recommendation: "Remove the host and allow its scripts with a nonce and 'strict-dynamic' instead.",
      });
    }
    if (t.startsWith('http://') && !upgrades) {
      out.add(Severity.LOW, `${lbl}: scripts allowed over plain HTTP from '${raw}'`, {
        sources: ['mixed-script', 'cspe-http'],
        brief: `Scripts allowed over plain HTTP from ${raw}`,
        description: 'On a page served over HTTPS, browsers block a plain-HTTP script as mixed content, so this source only fails to load. On a page served over plain HTTP the script can be replaced by anyone on the network path, and it runs with this page\'s privileges.',
        recommendation: `Use https:// for '${raw}', or add upgrade-insecure-requests.`,
      });
    }
  }

  function checkStyles(policy, out) {
    const elem = effective(policy, 'style-src-elem');
    const attr = effective(policy, 'style-src-attr');
    const leak = exfiltrationChannel(policy);
    if (elem) checkInline(label('style-src', elem), elem, 'style', out, leak);
    if (attr) checkInline(label('style-src', attr), attr, 'style', out, leak);
  }

  /**
   * The directive through which injected CSS can send what it reads to any
   * origin (a background image or a font), or null when both are restricted.
   * Missing, with no default-src to fall back on, counts as open.
   */
  function exfiltrationChannel(policy) {
    for (const name of ['img-src', 'font-src']) {
      const eff = effective(policy, name);
      if (!eff) return `${name} (not set, and no default-src)`;
      if (eff.lower.some(permissiveAncestor)) return eff.name === name ? name : `${name} (from ${eff.name})`;
    }
    return null;
  }

  const BROAD = new Set(['*', 'http:', 'https:']);

  function checkOthers(policy, out) {
    const object = effective(policy, 'object-src');
    if (!object) {
      out.add(Severity.LOW, 'Missing object-src directive', {
        sources: ['cspe-object', 'asvs-3.4.3', 'bp-csp'],
        brief: 'object-src is not set',
        description: 'With neither object-src nor default-src, <object> and <embed> can load content from anywhere, historically the easiest way around a CSP.',
        recommendation: "Add object-src 'none'.",
      }, true);
    } else if (object.lower.length > 0 && !(object.lower.length === 1 && object.lower[0] === "'none'")) {
      out.add(Severity.LOW, `Permissive object-src${object.name === 'object-src' ? '' : ' (from default-src)'}`, {
        sources: ['asvs-3.4.3', 'bp-csp'],
        brief: `object-src is not 'none'`,
        description: "Anything other than 'none' lets <object> and <embed> load content, and the content they load has been used to bypass CSP. No modern application needs plugins.",
        recommendation: "Set object-src 'none'.",
      });
    }

    const base = policy.directives.get('base-uri');
    if (!base) {
      out.add(baseCanRedirectTrusted(policy) ? Severity.MEDIUM : Severity.LOW, 'Missing base-uri directive', {
        sources: ['csp3-base', 'cspe-base-uri', 'asvs-3.4.3'],
        brief: 'base-uri is not set',
        description: 'base-uri does not fall back to default-src. Without it an injected <base href> redirects every relative script URL on the page to the attacker\'s server, which defeats a nonce-based policy, since the nonced <script> tag itself is legitimate.',
        recommendation: "Add base-uri 'none' (or 'self' if the page uses <base>).",
      }, true);
    } else if (base.lower.some((t) => BROAD.has(t) || t === 'data:')) {
      out.add(Severity.MEDIUM, 'Permissive base-uri', {
        sources: ['csp3-base', 'asvs-3.4.3'],
        brief: 'base-uri allows any URL',
        description: 'base-uri allows any URL as the document base, so an injected <base href> can point relative script URLs at the attacker\'s server.',
        recommendation: "Set base-uri 'none' or 'self'.",
      });
    }

    const ancestors = policy.directives.get('frame-ancestors');
    if (!ancestors) {
      out.add(Severity.LOW, 'Missing frame-ancestors directive', {
        sources: ['asvs-3.4.6', 'csp3-fa-nofallback', 'zap-10055-13'],
        brief: 'frame-ancestors is not set',
        description: 'frame-ancestors is the standard control for who may frame this page, and it takes precedence over X-Frame-Options in every browser that implements it. Without it, framing is decided by X-Frame-Options alone.',
        recommendation: "Add frame-ancestors 'none' (or 'self').",
      }, true);
    } else if (ancestors.lower.some(permissiveAncestor)) {
      out.add(Severity.MEDIUM, PERMISSIVE_FRAME_ANCESTORS, {
        sources: ['asvs-3.4.6', 'cs-xfo-fa'],
        brief: 'frame-ancestors allows any site',
        description: 'frame-ancestors allows any site to embed this page, so an attacker can frame it invisibly and trick the user into clicking it (clickjacking).',
        recommendation: "Set frame-ancestors 'none', 'self', or the exact origins that need to embed the page.",
      });
    }

    const def = policy.directives.get('default-src');
    if (!def) {
      out.add(Severity.LOW, 'Missing default-src directive', {
        sources: ['csp3-default', 'csp3-exfil', 'bp-csp'],
        brief: 'default-src is not set',
        description: 'Resource types without a directive of their own are unrestricted when default-src is absent: fonts, media, connections, frames and so on.',
        recommendation: "Add default-src 'none' (or 'self') as a baseline, then allow what each type needs.",
      }, true);
    } else if (def.lower.includes('*') || def.lower.includes('http:')) {
      out.add(Severity.LOW, 'Permissive default-src', {
        sources: ['csp3-default', 'bp-csp'],
        brief: 'default-src allows any origin',
        description: 'default-src applies to every resource type without its own directive, and this one allows any origin.',
        recommendation: "Use default-src 'none' or 'self' and add per-type directives.",
      });
    } else if (def.lower.includes('https:')) {
      out.add(Severity.LOW, "Permissive default-src 'https:'", {
        sources: ['csp3-default', 'bp-csp'],
        brief: 'default-src allows any HTTPS origin',
