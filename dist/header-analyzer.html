    'referrer-policy': L('With no policy of its own, the response inherits whatever default the browser applies, something the site does not control and that has already changed once. Current browsers use strict-origin-when-cross-origin, which sends no more than the origin; older ones send the complete URL, path and query string included, to every third party reached over HTTPS. Stating the policy makes every browser behave the same.', "Senza una policy propria, la risposta eredita il valore predefinito del browser, che il sito non controlla e che è già cambiato una volta. I browser attuali usano strict-origin-when-cross-origin, che non invia più dell'origine; quelli più vecchi inviano l'URL completo, percorso e query string compresi, a ogni terza parte raggiunta in HTTPS. Dichiarare la policy fa comportare allo stesso modo tutti i browser."),
    'cache-control': L('With no explicit caching instruction, browsers and intermediaries fall back to heuristic caching and may keep this response on disk. That is harmless for a static asset. It is a problem for a response meant only for signed-in users, which can then be read from the cache after logout or by the next person to use a shared machine.', "Senza un'istruzione di cache esplicita, browser e intermediari ricadono sulla cache euristica e possono conservare questa risposta su disco. È innocuo per un asset statico. È un problema per una risposta riservata agli utenti autenticati, che può essere letta dalla cache dopo il logout o dalla persona successiva su un computer condiviso."),
    'clear-site-data': L('This response clears no site data. On almost every response that is the right outcome: the header exists to end things, not to be present.', "Questa risposta non cancella dati del sito. Su quasi ogni risposta è il risultato corretto: l'header serve a chiudere qualcosa, non a essere presente."),
    'permissions-policy': L(`Every feature stays at the allowlist a browser applies by default, which leaves two things open. A cross-origin document embedded in this page can use the features a browser allows to every origin (${[...PP_TRACKING].sort().join(', ')}) which is tracking and fingerprinting surface. And script that achieves execution on this origin can raise the permission prompt for ${PP_ONE_CLICK.join(', ')}: the prompt names the site, never the code that asked, so one click from a user who cannot tell the two apart is the whole interaction. A policy is the only thing that removes the prompt.`, `Ogni funzionalità resta all'allowlist che il browser applica per impostazione predefinita, e questo lascia aperte due cose. Un documento cross-origin incorporato in questa pagina può usare le funzionalità che il browser consente a ogni origine (${[...PP_TRACKING].sort().join(', ')}), che sono superficie di tracciamento e fingerprinting. E uno script che riesce a eseguire su questa origine può far comparire la richiesta di autorizzazione per ${PP_ONE_CLICK.join(', ')}: la richiesta indica il sito, mai il codice che l'ha fatta, quindi un clic da parte di un utente che non può distinguere i due è tutta l'interazione. Solo una policy elimina la richiesta.`),
    'x-dns-prefetch-control': DNS_PREFETCH_TEXT,
    'origin-agent-cluster': L('Without it the browser decides whether this page shares an agent cluster with other same-site origins. ?1 asks for origin-keyed isolation, which also disables the document.domain relaxation for this origin.', "Senza questo header il browser decide se questa pagina condivide un agent cluster con altre origini dello stesso sito. ?1 chiede l'isolamento per origine, che disattiva anche il rilassamento di document.domain per questa origine."),
    'x-permitted-cross-domain-policies': L('Without this header, Adobe clients still look for a policy file at the site root (/crossdomain.xml) and honour what it grants; other policy files on the site need a meta-policy of by-content-type or all. Setting none makes the restriction explicit: no policy file on the origin, the root one included, can grant cross-domain access.', "Senza questo header, i client Adobe cercano comunque un file di policy nella radice del sito (/crossdomain.xml) e rispettano ciò che concede; gli altri file di policy sul sito richiedono una meta-policy by-content-type o all. Impostare none rende esplicita la restrizione: nessun file di policy sull'origine, compreso quello nella radice, può concedere accesso cross-domain."),
    'cross-origin-embedder-policy': L('Without COEP the document cannot be cross-origin isolated, which only matters if it needs SharedArrayBuffer or high-resolution timers. Nothing is exposed by its absence.', "Senza COEP il documento non può essere isolato cross-origin, il che conta solo se ha bisogno di SharedArrayBuffer o di timer ad alta risoluzione. La sua assenza non espone nulla."),
    'cross-origin-resource-policy': L('Without CORP any site can embed this resource in no-cors mode, pulling it into that site\'s process.', "Senza CORP qualsiasi sito può incorporare questa risorsa in modalità no-cors, portandola nel processo di quel sito."),
  };

  // The passages behind each absence's grade and description.
  const MISSING_SOURCES = {
    'content-security-policy': ['zap-10038-1', 'obs-csp-absent', 'asvs-3.4.3'],
    'strict-transport-security': ['asvs-3.4.1', 'obs-hsts-absent', 'zap-10035-1', 'ps-hsts'],
    'x-frame-options': ['zap-10020-1', 'obs-xfo-absent', 'cs-xfo-rec'],
    'x-content-type-options': ['zap-10021', 'obs-xcto-absent', 'asvs-3.4.4'],
    'cross-origin-opener-policy': ['zap-90004-3', 'obs-coop-absent', 'asvs-3.4.8'],
    'permissions-policy': ['zap-10063-1', 'cs-pp-rec'],
    'referrer-policy': ['asvs-3.4.5', 'obs-rp-absent', 'cs-rp-default', 'cs-rp-rec'],
    'cross-origin-embedder-policy': ['zap-90004-2', 'cs-coep'],
    'cross-origin-resource-policy': ['zap-90004-1', 'cs-corp'],
    'x-permitted-cross-domain-policies': ['adobe-default', 'adobe-master', 'mdn-xpcdp-none'],
    'cache-control': ['zap-10015', 'asvs-14.3.2', 'bp-cache', 'rfc9111-heuristic'],
    'clear-site-data': ['asvs-14.3.1', 'bp-csd-logout', 'session-csd', 'csd-logout'],
    'x-dns-prefetch-control': ['cs-xdns', 'bp-xdns-pii', 'bp-xdns-inj', 'cs-xdns-nonstd'],
    'origin-agent-cluster': ['html-oac', 'mdn-docdomain-oac', 'mdn-docdomain-shared', 'chrome-docdomain-115'],
  };

  const PRAGMA_INSTEAD = L('The response does carry Pragma, but Pragma does not stand in for Cache-Control: its meaning in a response was never specified, so caches and browsers are free to ignore it.', "La risposta contiene Pragma, ma Pragma non sostituisce Cache-Control: il suo significato in una risposta non è mai stato specificato, quindi cache e browser sono liberi di ignorarlo.");

  const ABSENT_SOURCES = {
    'service-worker-allowed': ['sw-allowed'],
    'content-disposition': ['cs-download'],
    'pragma': ['rfc9111-pragma'],
    'expires': ['rfc9111-expires'],
    'x-download-options': ['ie-end'],
    'etag': ['rfc9110-etag', 'rfc9110-etag-privacy'],
  };

  // The clause after "Missing." in the findings list: what is left unprotected.
  const MISSING_BRIEF = {
    'content-security-policy': L('No defence in depth against XSS', "Nessuna difesa in profondità contro l'XSS"),
    'strict-transport-security': L('HTTPS is not enforced', "HTTPS non è imposto"),
    'x-frame-options': L('Framing is not restricted by this header', "Il framing non è ristretto da questo header"),
    'x-content-type-options': L('MIME sniffing is not disabled', "Il MIME sniffing non è disattivato"),
    'cross-origin-opener-policy': L('Cross-origin windows are not isolated', "Le finestre cross-origin non sono isolate"),
    'permissions-policy': L('Browser features are not restricted', "Le funzionalità del browser non sono soggette a restrizioni"),
    'referrer-policy': L('Referrer leakage depends on browser defaults', "L'eventuale esposizione del Referer dipende dalle impostazioni predefinite del browser"),
    'cross-origin-embedder-policy': L('No cross-origin isolation', "Nessun isolamento cross-origin"),
    'cross-origin-resource-policy': L('Any site can load the resource', "Qualsiasi sito può caricare la risorsa"),
    'x-permitted-cross-domain-policies': L('Cross-domain policy files are not restricted', "I file di policy cross-domain non sono ristretti"),
    'cache-control': L('Caching is not controlled', "La cache non è controllata"),
    'clear-site-data': L('Session data is not cleared', "I dati di sessione non vengono cancellati"),
    'x-dns-prefetch-control': L('DNS prefetching is not disabled', "Il DNS prefetching non è disattivato"),
    'origin-agent-cluster': L('Origin keying is not requested', "L'isolamento per origine non è richiesto"),
  };

  // ---------------------------------------------------------------------------
  // REST API mode. The user says the response is a call to an API read by a
  // browser; nothing here guesses it. The reference is the OWASP REST Security
  // Cheat Sheet: six headers for every API response, three more as defence in
  // depth for a response that might be rendered as HTML. Headers outside it
  // keep their page rules, except those that only act on a document.
  // ---------------------------------------------------------------------------
  // The cheat sheet's defence-in-depth headers only act on a response rendered
  // as HTML. In this mode the response is an API response, so a gap in them is
  // explained, never graded: asking whether the API might return HTML would
  // reopen what the mode already settles.
  const API_DEFENCE_SOURCES = ['rest-dd', 'rest-dd-never'];

  function apiDefenceNote(header, title, what, setting, sources) {
    return finding(header, Severity.OK, title, {
      status: Status.NONE,
      description: L(`${what} The OWASP REST Security Cheat Sheet lists this header as defence in depth for responses rendered as HTML, and an API response is not one, so there is nothing to report. ${setting} costs nothing if you want it anyway.`, `${what} L'OWASP REST Security Cheat Sheet elenca questo header come difesa in profondità per le risposte visualizzate come HTML, e una risposta di un'API non lo è, quindi non c'è nulla da riportare. ${setting} non costa nulla, se lo si vuole comunque.`),
      sources: [...sources, ...API_DEFENCE_SOURCES],
    });
  }
  const API_CT_REC = L('Declare the type the API returns, such as Content-Type: application/json', "Dichiarare il tipo che l'API restituisce, per esempio Content-Type: application/json");
  // MIME Sniffing: the JavaScript MIME types.
  const JS_TYPES = new Set(['application/ecmascript', 'application/javascript', 'application/x-ecmascript', 'application/x-javascript',
    'text/ecmascript', 'text/javascript', 'text/javascript1.0', 'text/javascript1.1', 'text/javascript1.2', 'text/javascript1.3',
    'text/javascript1.4', 'text/javascript1.5', 'text/jscript', 'text/livescript', 'text/x-ecmascript', 'text/x-javascript']);

  const apiTitle = (header, empty) => (empty ? L(`${header}: present but empty`, `${header}: presente ma vuoto`) : L(`Missing ${header}`, `${header} mancante`));
  const apiStatus = (empty) => (empty ? Status.MISCONFIGURED : Status.MISSING);

  function apiCsp(value, empty) {
    const H = 'Content-Security-Policy';
    const view = value === null ? { frameNone: false, frameRestricted: false, frameAncestors: null, defaultNone: false, defaultSrc: null } : HL.csp.apiView(value);
    const out = [];
    if (view.frameNone) {
      out.push(finding(H, Severity.OK, L("CSP: frame-ancestors 'none' (no site can frame this response)", "CSP: frame-ancestors 'none' (nessun sito può incorniciare questa risposta)"), { sources: ['rest-fa'] }));
    } else {
      const restricted = view.frameRestricted;
      const title = value === null ? apiTitle(H, empty)
        : view.frameAncestors === null ? L("CSP: frame-ancestors is not set, so any site can frame this response", "CSP: frame-ancestors non è impostata, quindi qualsiasi sito può incorniciare questa risposta")
          : L(`CSP: frame-ancestors ${view.frameAncestors} lets ${restricted ? 'the sites it names' : 'any site'} frame this response`, `CSP: frame-ancestors ${view.frameAncestors} permette a ${restricted ? 'i siti che indica' : 'qualsiasi sito'} di incorniciare questa risposta`);
      out.push(finding(H, Severity.LOW, title, {
        status: value === null ? apiStatus(empty) : view.frameAncestors === null ? Status.MISSING : Status.MISCONFIGURED,
        brief: restricted ? L("frame-ancestors is not 'none'", "frame-ancestors non è 'none'") : L('Any site can frame the response', "Qualsiasi sito può incorniciare la risposta"),
        description: L(`${restricted ? 'The sites this directive names' : 'Any site'} can load this API response in a frame. A page that frames it can lead a signed-in user to drag the data shown in it into a field the page controls (drag-and-drop clickjacking). An API response never needs to be framed, so frame-ancestors 'none' costs nothing.`, `${restricted ? 'I siti indicati da questa direttiva' : 'Qualsiasi sito'} può caricare in un frame questa risposta dell'API. Una pagina che la incornicia può indurre un utente autenticato a trascinare i dati mostrati in un campo controllato dalla pagina (clickjacking con drag-and-drop). Una risposta di un'API non ha mai bisogno di essere incorniciata, quindi frame-ancestors 'none' non costa nulla.`),
        recommendation: "Content-Security-Policy: frame-ancestors 'none'",
        sources: ['rest-fa', 'rest-fa-dnd', 'rest-scope', 'asvs-3.4.6'],
      }));
    }
    if (view.defaultNone) {
      out.push(finding(H, Severity.OK, L("CSP: default-src 'none' (the response may load nothing)", "CSP: default-src 'none' (la risposta non può caricare nulla)"), { sources: ['rest-csp-dd'] }));
    } else {
      out.push(apiDefenceNote(H,
        view.defaultSrc === null ? L("CSP: default-src 'none' is not set (not needed on an API response)", "CSP: default-src 'none' non è impostata (non necessaria su una risposta di un'API)") : L(`CSP: default-src ${view.defaultSrc} instead of 'none' (not needed on an API response)`, `CSP: default-src ${view.defaultSrc} invece di 'none' (non necessaria su una risposta di un'API)`),
        L("default-src 'none' stops a response rendered as HTML from loading or running anything.", "default-src 'none' impedisce a una risposta visualizzata come HTML di caricare o eseguire qualsiasi cosa."),
        "Content-Security-Policy: default-src 'none'", ['rest-csp-dd']));
    }
    return out;
  }

  function apiXFrameOptions(value, empty, ctx, framingByCsp) {
    const H = 'X-Frame-Options';
    if (value === null) {
      return [finding(H, Severity.LOW, apiTitle(H, empty), {
        status: apiStatus(empty), brief: framingByCsp ? L('Only CSP frame-ancestors restricts framing', "Solo frame-ancestors della CSP restringe il framing") : L('Framing is not restricted by this header', "Il framing non è ristretto da questo header"),
        description: framingByCsp
          ? L('CSP frame-ancestors already restricts framing in every current browser. X-Frame-Options: DENY is the legacy fallback the OWASP REST Security Cheat Sheet still recommends, for browsers without CSP Level 2.', "frame-ancestors della CSP restringe già il framing in ogni browser attuale. X-Frame-Options: DENY è il fallback legacy che l'OWASP REST Security Cheat Sheet raccomanda ancora, per i browser senza CSP Level 2.")
          : L('Neither this header nor CSP frame-ancestors stops another site framing this API response. The OWASP REST Security Cheat Sheet recommends X-Frame-Options: DENY next to frame-ancestors \'none\', for browsers without CSP Level 2.', "Né questo header né frame-ancestors della CSP impediscono a un altro sito di incorniciare questa risposta dell'API. L'OWASP REST Security Cheat Sheet raccomanda X-Frame-Options: DENY accanto a frame-ancestors 'none', per i browser senza CSP Level 2."),
        recommendation: 'X-Frame-Options: DENY',
        sources: ['rest-xfo', 'rest-fa'],
      })];
    }
    const page = checkXFrameOptions(value, ctx);
    if (page.length === 1 && page[0].title.startsWith('X-Frame-Options: SAMEORIGIN')) {
      return [finding(H, Severity.LOW, L('X-Frame-Options: SAMEORIGIN instead of DENY', "X-Frame-Options: SAMEORIGIN invece di DENY"), {
        status: Status.MISCONFIGURED, brief: L('SAMEORIGIN instead of DENY', "SAMEORIGIN invece di DENY"),
        description: L('SAMEORIGIN still lets a page on this origin frame the response. An API response never needs to be framed, and DENY is the value the OWASP REST Security Cheat Sheet recommends.', "SAMEORIGIN permette comunque a una pagina di questa origine di incorniciare la risposta. Una risposta di un'API non ha mai bisogno di essere incorniciata, e DENY è il valore che l'OWASP REST Security Cheat Sheet raccomanda."),
        recommendation: 'X-Frame-Options: DENY',
        sources: ['rest-xfo', 'rest-fa'],
      })];
    }
    return page;
  }

  const JS_TYPE_RISK = L('The response declares itself a script. Another site can include it with <script src>, and the browser runs it there with the user\'s cookies: data the script holds can be read by that site (Cross-Site Script Inclusion). A JSON type is not run that way.', "La risposta si dichiara uno script. Un altro sito può includerla con <script src>, e il browser la esegue lì con i cookie dell'utente: i dati contenuti nello script possono essere letti da quel sito (Cross-Site Script Inclusion). Un tipo JSON non viene eseguito in quel modo.");

  /**
   * What the pasted body plainly is: 'json' for an object or array that parses
   * as JSON, 'html' for a document that opens with a doctype or <html>, null
   * for anything else (no body, a fragment, compressed bytes). Only these two
   * answers settle a check; anything less certain leaves it to confirm.
   */
  function bodyKind(body) {
    const text = String(body || '').replace(/^\uFEFF/, '').trim();
    if (/^[[{]/.test(text)) {
      try { JSON.parse(text); return 'json'; } catch (_) { return null; }
    }
    if (/^<!doctype\s+html[\s>]/i.test(text) || /^<html[\s>]/i.test(text)) return 'html';
    return null;
  }

  function apiContentType(value, empty, ctx) {
    const H = 'Content-Type';
    const kind = bodyKind(ctx && ctx.body);
    if (value === null) {
      return [finding(H, Severity.LOW, apiTitle(H, empty), {
        status: apiStatus(empty), brief: L('Browsers may guess the content type', "I browser possono indovinare il tipo di contenuto"),
        description: L('Without a Content-Type, a browser may guess the type from the bytes and read this API response as HTML or script (MIME sniffing). The OWASP REST Security Cheat Sheet and ASVS 4.1.1 ask every response to declare it.', "Senza Content-Type, un browser può indovinare il tipo dai byte e leggere questa risposta dell'API come HTML o script (MIME sniffing). L'OWASP REST Security Cheat Sheet e ASVS 4.1.1 chiedono che ogni risposta lo dichiari."),
        recommendation: API_CT_REC,
        sources: ['rest-ct', 'rest-ct-guess', 'asvs-4.1.1'],
      })];
    }
    const mime = extractMimeType(value);
    if (!mime) {
      return [finding(H, Severity.LOW, L(`Content-Type: '${value}' is not a valid MIME type`, `Content-Type: '${value}' non è un MIME type valido`), {
        status: Status.MISCONFIGURED, brief: L('Invalid value, so browsers may guess the type', "Valore non valido, quindi i browser possono indovinare il tipo"),
        description: L('A browser cannot read a type from this value, so it is in the same position as one that received none, and may guess the type from the bytes.', "Un browser non riesce a leggere un tipo da questo valore, quindi è nella stessa situazione di uno che non ne ha ricevuto nessuno, e può indovinare il tipo dai byte."),
        recommendation: API_CT_REC,
        sources: ['rest-ct-guess', 'fetch-mime', 'asvs-4.1.1'],
      })];
    }
    if (mime.essence === 'text/html' && kind === 'html') {
      return [finding(H, Severity.OK, L('Content-Type: text/html, and the body is an HTML document', "Content-Type: text/html, e il corpo è un documento HTML"), { sources: ['rest-ct'] })];
    }
    if (mime.essence === 'text/html' && kind === 'json') {
      return [finding(H, Severity.LOW, L('Content-Type: text/html on a JSON body', "Content-Type: text/html su un corpo JSON"), {
        status: Status.MISCONFIGURED, brief: L('JSON declared as HTML', "JSON dichiarato come HTML"),
        description: L('The body is JSON, but the response declares itself HTML, so a browser that opens it renders it as a page, and anything injected into it can run as markup.', "Il corpo è JSON, ma la risposta si dichiara HTML, quindi un browser che la apre la visualizza come pagina, e qualsiasi cosa vi sia iniettata può essere eseguita come markup."),
        recommendation: API_CT_REC,
        sources: ['rest-ct', 'asvs-4.1.1'],
      })];
    }
    if (mime.essence === 'text/html') {
      return [finding(H, Severity.LOW, L('Content-Type: text/html on an API response', "Content-Type: text/html su una risposta di un'API"), {
        status: Status.MISCONFIGURED, brief: L('Declared as HTML', "Dichiarato come HTML"),
        description: L('The response declares itself HTML, so a browser that opens it renders it as a page, and anything injected into it can run as markup.', "La risposta si dichiara HTML, quindi un browser che la apre la visualizza come pagina, e qualsiasi cosa vi sia iniettata può essere eseguita come markup."),
        ...check(L('Is the body of the response an HTML document?', "Il corpo della risposta è un documento HTML?"), L('no (JSON, XML, plain text or anything else)', "no (JSON, XML, testo semplice o altro)"), L('yes', 'sì')),
        sources: ['rest-ct', 'asvs-4.1.1'],
      })];
    }
    if (JS_TYPES.has(mime.essence) && kind === 'json') {
      return [finding(H, Severity.LOW, L(`Content-Type: ${mime.essence} on a JSON body`, `Content-Type: ${mime.essence} su un corpo JSON`), {
        status: Status.MISCONFIGURED, brief: L('JSON declared as JavaScript', "JSON dichiarato come JavaScript"),
        description: JS_TYPE_RISK.replace('The response declares itself a script.', 'The body is JSON, but the response declares itself a script.'),
        recommendation: API_CT_REC,
        sources: ['rest-ct-js', 'mimesniff-js', 'mdn-corp-xssi'],
      })];
    }
    if (JS_TYPES.has(mime.essence)) {
      return [finding(H, Severity.LOW, L(`Content-Type: ${mime.essence} on an API response`, `Content-Type: ${mime.essence} su una risposta di un'API`), {
        status: Status.MISCONFIGURED, brief: L('Declared as JavaScript', "Dichiarato come JavaScript"),
        description: JS_TYPE_RISK,
        ...check(L('Is the body of the response a script (JavaScript code)?', "Il corpo della risposta è uno script (codice JavaScript)?"), L('no (JSON or anything else)', "no (JSON o altro)"), L('yes', 'sì')),
        sources: ['rest-ct-js', 'mimesniff-js', 'mdn-corp-xssi'],
      })];
    }
    return [finding(H, Severity.OK, `Content-Type: ${mime.essence}`, { sources: ['rest-ct'] })];
  }

  function apiPermissionsPolicy(value, empty) {
    const H = 'Permissions-Policy';
    const parsed = value === null ? null : parseSfDictionary(value);
    if (parsed && parsed.ok) {
      // OK when every feature it names is closed with (), as in the cheat
      // sheet's example; it need not name them all.
      const open = [...parsed.dict].filter(([, member]) => {
        const origins = ppAllowlist(member);
        return origins === null || origins.length > 0;   // an invalid allowlist is dropped: the default applies
      }).map(([feature]) => feature).sort();
      if (!open.length) return [finding(H, Severity.OK, L('Permissions-Policy: every feature it names is disabled', "Permissions-Policy: ogni funzionalità indicata è disattivata"), { sources: ['rest-pp'] })];
      return [apiDefenceNote(H, L(`Permissions-Policy: allows ${open.join(', ')} (not needed on an API response)`, `Permissions-Policy: consente ${open.join(', ')} (non necessaria su una risposta di un'API)`),
        L('The policy restricts the browser features a response rendered as HTML could use.', "La policy restringe le funzionalità del browser che una risposta visualizzata come HTML potrebbe usare."),
        L('Closing every feature with an empty allowlist (), as in the cheat sheet\'s example,', "Chiudere ogni funzionalità con un'allowlist vuota (), come nell'esempio della cheat sheet,"), ['rest-pp'])];
    }
    return [apiDefenceNote(H, value === null ? (empty ? L('Permissions-Policy: present but empty (not needed on an API response)', "Permissions-Policy: presente ma vuota (non necessaria su una risposta di un'API)") : L('Permissions-Policy: not set (not needed on an API response)', "Permissions-Policy: non impostata (non necessaria su una risposta di un'API)"))
      : L(`Permissions-Policy: '${value}' is not a valid policy (not needed on an API response)`, `Permissions-Policy: '${value}' non è una policy valida (non necessaria su una risposta di un'API)`),
    L('The policy restricts the browser features a response rendered as HTML could use.', "La policy restringe le funzionalità del browser che una risposta visualizzata come HTML potrebbe usare."),
    L('A policy that closes every feature with (), as in the cheat sheet\'s example,', "Una policy che chiude ogni funzionalità con (), come nell'esempio della cheat sheet,"), ['rest-pp'])];
  }

  function apiReferrerPolicy(value, empty) {
    const H = 'Referrer-Policy';
    let n = '';
    if (value !== null) {
      for (const token of splitOutsideQuotes(value, ',')) {
        if (REFERRER_POLICIES.has(token.toLowerCase())) n = token.toLowerCase();
      }
    }
    if (n === 'no-referrer') return [finding(H, Severity.OK, 'Referrer-Policy: no-referrer', { sources: ['rest-rp', 'referrer-last'] })];
    const title = value === null ? (empty ? L('Referrer-Policy: present but empty', "Referrer-Policy: presente ma vuota") : L('Referrer-Policy: not set', "Referrer-Policy: non impostata"))
      : n === '' ? L(`Referrer-Policy: unrecognized value '${value}'`, `Referrer-Policy: valore non riconosciuto '${value}'`) : L(`Referrer-Policy: '${n}' instead of no-referrer`, `Referrer-Policy: '${n}' invece di no-referrer`);
    return [apiDefenceNote(H, L(`${title} (not needed on an API response)`, `${title} (non necessaria su una risposta di un'API)`),
      L('A response that is not HTML triggers no further requests, so it has no referrer to send.', "Una risposta che non è HTML non genera altre richieste, quindi non ha un referrer da inviare."),
      'Referrer-Policy: no-referrer', ['rest-rp'])];
  }

  function apiCorp(value, empty, ctx) {
    const H = 'Cross-Origin-Resource-Policy';
    if (value !== null) return checkCorp(value, ctx);
    return [finding(H, Severity.LOW, apiTitle(H, empty), {

  HL.rules = Object.freeze({
    SECURITY_HEADERS,
    REFLECTION_REPLAY,
    analyzeHeaders,
    PP_TRACKING,
    PP_ONE_CLICK,
  });

      recommendation: L('Once the reports are clean, send the same policy as Content-Security-Policy.', "Quando i report sono puliti, inviare la stessa policy come Content-Security-Policy."),
    })]];
  }

  const RULES = [corsCredentials, frameAncestorsReplacesXfo, reportOnlyPolicy];

  function apply(results, headers) {
    const byKey = new Map(results.map((r) => [r.key, r]));
    for (const rule of RULES) {
      for (const [key, f] of rule(byKey, headers)) {
        const target = byKey.get(key);
        if (target) target.findings.push(f);
      }
    }
  }

  HL.correlations = Object.freeze({ apply });

/*
 * Header Analyzer: the engine's public entry point.
 *
 * `analyze` never throws: whatever the input, it returns a report object,
 * with `ok: false` and a message a person can act on when there is nothing to
 * analyse, or when the engine itself failed, which is reported as such rather
 * than as a verdict about the response.
 */
globalThis.HeaderAnalyzer.i18n.module(function (HL, L) {
  'use strict';

  const { Severity, SEVERITY_NAMES, Status, isContingent } = HL.models;
  const VERSION = '1.0.0';

  function tally(findings) {
    const counts = {};
    for (const name of SEVERITY_NAMES) counts[name] = 0;
    for (const f of findings) counts[SEVERITY_NAMES[f.severity]]++;
    return counts;
  }

  function summarize(results) {
    const all = results.flatMap((r) => r.findings);
    let worst = Severity.OK;
    for (const f of all) if (f.severity > worst) worst = f.severity;
    const atWorst = all.filter((f) => f.severity === worst);
    return {
      worst,
      worstName: SEVERITY_NAMES[worst],
      // Marked when only a contingent finding reaches the top: an unconfirmed
      // HIGH heading an otherwise clean report would read as a verdict the tool
      // has not earned.
      worstIsContingent: atWorst.length > 0 && worst > Severity.OK && atWorst.every(isContingent),
      settled: tally(all.filter((f) => !isContingent(f) && f.severity > Severity.OK)),
      toConfirm: tally(all.filter((f) => isContingent(f))),
    };
  }

  function failure(error, extra) {
    return Object.assign({ ok: false, error, notes: [], results: [], summary: null }, extra || {});
  }

  /**
   * @param {string} text       raw response text
   * @param {string} profileId  'basic' | 'extended'
   * @param {string} modeId     'page' | 'api': what the user says the response is
   */
  function analyze(text, profileId, modeId) {
    const profile = HL.profiles.getProfile(profileId);
    const mode = HL.profiles.getMode(modeId);
    const meta = { version: VERSION, profile: { id: profile.id, name: profile.name }, mode: { id: mode.id, name: mode.name } };
    try {
      if (typeof text !== 'string' || text.trim() === '') {
        return failure('empty', meta);
      }
      const parsed = HL.parser.parseResponse(text);
      if (parsed.error) return failure(parsed.error, Object.assign(meta, { notes: parsed.notes }));
      const response = parsed.response;
      if (!response || response.fields.length === 0) {
        return failure(L('No HTTP header fields were found. Paste a raw response: a status line such as "HTTP/1.1 200 OK", then one "Name: value" per line.', "Non è stato trovato nessun campo di header HTTP. Incollare una risposta grezza: una riga di stato come \"HTTP/1.1 200 OK\", poi un \"Nome: valore\" per riga."), meta);
      }

      const notes = [...parsed.notes, ...response.notes];
      const results = HL.rules.analyzeHeaders(HL.parser.headerMap(response), profile, { status: response.status, mode, body: response.body });
      return Object.assign(meta, {
        ok: true,
        error: null,
        status: response.status,
        notes,
        results,
        summary: summarize(results),
      });
    } catch (e) {
      return failure('internal', Object.assign(meta, { detail: e && e.stack ? String(e.stack) : String(e) }));
    }
  }

  // When one header has problems of several kinds, the line carries the status
  // of the most severe; on a tie, the first of these.
  const STATUS_PRECEDENCE = [Status.MISSING, Status.MISCONFIGURED, Status.DEPRECATED, Status.DUPLICATED];
  // The words the list is written with: in Italian, those of the report template.
  const STATUS_LABEL = {
    [Status.MISSING]: L('Missing', 'Assente'),
    [Status.MISCONFIGURED]: L('Misconfigured', 'Configurazione non corretta'),
    [Status.DUPLICATED]: L('Duplicated', 'Duplicato'),
    [Status.DEPRECATED]: L('Deprecated', 'Deprecato'),
  };
  const MAX_BRIEFS = 3;

  /** "Sent 2 times" → "sent 2 times" inside a sentence; "SAMEORIGIN …" and "'none' …" stay. */
  function midSentence(brief) {
    return /^[A-Z][a-z]/.test(brief) ? brief[0].toLowerCase() + brief.slice(1) : brief;
  }

  /**
   * One line per header: `<Header>: <status>. <brief>.`
   *
   * Each header's listed findings are merged. The status is the one of the most
   * severe finding (STATUS_PRECEDENCE breaks ties). The brief joins the
   * findings' briefs, most severe first, with "; ", keeping at most MAX_BRIEFS
   * and summing up the rest as "and N more"; the detailed report has them all.
   *
   * Every finding with a severity is listed (OK notes never are). `show`
   * selects which: 'all' (the default), 'confirmed' (only findings the response
   * settles) or 'toConfirm' (only those that need a check, each marked
   * "(to confirm)"). A header with both kinds appears under each, with the
   * findings of that kind. A finding the user confirmed (see resolve) counts as
   * settled.
   * Lines are sorted by their most severe finding; ties keep the report's order.
   */
  const SHOW = ['all', 'confirmed', 'toConfirm'];

  function findingList(report, options) {
    const o = Object.assign({ show: 'all' }, options || {});
    if (!SHOW.includes(o.show)) throw new Error(`Unknown findings list option: ${o.show}`);
    if (!report || !report.ok) return [];
    const lines = [];
    report.results.forEach((r, order) => {
      const items = [];
      const seen = new Set();
      for (const f of r.findings) {
        if (f.status === Status.NONE || f.severity === Severity.OK) continue;
        const contingent = isContingent(f);
        if ((o.show === 'confirmed' && contingent) || (o.show === 'toConfirm' && !contingent)) continue;
        const brief = f.brief + (contingent ? L(' (to confirm)', " (da confermare)") : '');
        if (seen.has(brief)) continue;          // two routes to the same problem
        seen.add(brief);
        items.push({ status: f.status, brief, severity: f.severity, toConfirm: contingent });
      }
      if (!items.length) return;

      items.sort((a, b) => b.severity - a.severity
        || STATUS_PRECEDENCE.indexOf(a.status) - STATUS_PRECEDENCE.indexOf(b.status));
      const top = items[0];
      const shown = items.slice(0, MAX_BRIEFS).map((it, k) => (k === 0 ? it.brief : midSentence(it.brief)));
      const rest = items.length - shown.length;
      const brief = shown.join('; ') + (rest > 0 ? L(`; and ${rest} more`, `; e altri ${rest}`) : '');
      lines.push({
        header: r.name,
        status: top.status,
        brief,
        severity: SEVERITY_NAMES[top.severity],
        // Unconfirmed when nothing settled reaches the line's severity.
        toConfirm: items.filter((it) => it.severity === top.severity).every((it) => it.toConfirm),
        text: `${r.name}: ${STATUS_LABEL[top.status]}. ${brief}.`,
        items: items.map((it) => ({ ...it, severity: SEVERITY_NAMES[it.severity] })),
        rank: -top.severity,
        order,
      });
    });
    lines.sort((a, b) => a.rank - b.rank || a.order - b.order);
    return lines.map(({ rank, order, ...line }) => line);
  }

  const DECISIONS = ['confirmed', 'excluded'];

  /** The key a decision is stored under: the header, then the finding's place in it. */
  function decisionKey(result, index) {
    return `${result.key}#${index}`;
  }

  /**
   * The report as the user's checks leave it. `decisions` maps decisionKey()
   * to 'confirmed' or 'excluded', and only findings to confirm take one: a
   * confirmed finding becomes settled; an excluded one is
   * dropped. Everything else, and the report passed in, stays as it was.
   */
  function resolve(report, decisions) {
    if (!report || !report.ok || !decisions || !decisions.size) return report;
    const results = report.results.map((r) => {
      const findings = [];
      r.findings.forEach((f, i) => {
        const d = isContingent(f) ? decisions.get(decisionKey(r, i)) : undefined;
        if (d !== undefined && !DECISIONS.includes(d)) throw new Error(`Unknown decision: ${d}`);
        if (d === 'excluded') return;
        findings.push(d === 'confirmed' ? Object.assign({}, f, { verify: '' }) : f);
      });
      return Object.assign({}, r, { findings });
    });
    return Object.assign({}, report, { results, summary: summarize(results) });
  }

  HL.engine = Object.freeze({ analyze, findingList, resolve, decisionKey, VERSION });
});

      textToCopy: 'Testo da copiare', copyManually: 'Copia manualmente',
      clipboardRefused: 'Questa pagina potrebbe non poter scrivere negli appunti. Il testo è selezionato: premi Ctrl+C (⌘C su Mac).', close: 'Chiudi',
      noFiles: 'I file non vengono aperti: incolla invece la risposta',
      crashed: 'Qualcosa è andato storto in Header Analyzer. Ricarica la pagina se si comporta in modo strano.',
    },
  };

  /** The interface text for `key` in the current language; a function entry takes arguments. */
  function tr(key, ...args) {
    const v = UI_TEXT[state.lang][key];
    return typeof v === 'function' ? v(...args) : v;
  }

  /**
   * A saved choice wins; without one, Italian for an Italian browser and
   * English otherwise. navigator.language is the browser's own language (in
   * Chrome it can differ from the first language preferred for websites).
   */
  function initialLang() {
    const saved = storage.get('lang');
    if (HL.i18n.LANGS.includes(saved)) return saved;
    const browser = [navigator.language, navigator.languages && navigator.languages[0]];
    return browser.some((l) => /^it\b/i.test(l || '')) ? 'it' : HL.i18n.DEFAULT_LANG;
  }

  /** The engine in the current language. */
  const core = () => HL.i18n.localized(state.lang).engine;

  // -------------------------------------------------------------------- state

  const state = {
    profile: HL.profiles.getProfile(storage.get('profile')).id,
    mode: HL.profiles.getMode(storage.get('mode')).id,
    lang: HL.i18n.DEFAULT_LANG,
    filter: 'all',
    query: '',
    report: null,
    open: new Set(),
    // Findings to confirm the user has checked: decisionKey -> 'confirmed' | 'excluded'.
    decisions: new Map(),
    lastInput: null,
  };

  // ---------------------------------------------------------------- feedback

  let toastTimer = 0;
  function toast(message) {
    const t = $('toast');
    t.textContent = message;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2400);
  }

  function announce(message) {
    const a = $('announcer');
    a.textContent = '';
    // A fresh node each time makes screen readers repeat identical messages.
    setTimeout(() => { a.textContent = message; }, 30);
  }

  // ------------------------------------------------------------- appearance

  // A saved choice wins; without one the page follows the system, also when
  // the system setting changes while the page is open. theme.js applies the
  // saved choice before the first paint.
  const systemDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

  function savedTheme() {
    const t = storage.get('theme');
    return t === 'light' || t === 'dark' ? t : null;
  }

  function currentTheme() {
    return savedTheme() || (systemDark && systemDark.matches ? 'dark' : 'light');
  }

  function applyTheme() {
    const theme = currentTheme();
    if (savedTheme()) document.documentElement.setAttribute('data-theme', theme);
    else document.documentElement.removeAttribute('data-theme');
    const label = theme === 'dark' ? tr('toLight') : tr('toDark');
    const b = $('theme-button');
    b.setAttribute('aria-label', label);
    b.title = label;
  }


  // ---------------------------------------------------------------- profile

  function applyProfile() {
    for (const b of document.querySelectorAll('#profile-control [data-profile]')) {
      const on = b.dataset.profile === state.profile;
      b.setAttribute('aria-checked', String(on));
      b.tabIndex = on ? 0 : -1;
      b.title = tr('profileHint')[b.dataset.profile];
    }
  }

  function setProfile(id) {
    if (id === state.profile) return;
    state.profile = HL.profiles.getProfile(id).id;
    storage.set('profile', state.profile);
    applyProfile();
    runAnalysis(true);
  }

  // ------------------------------------------------------------------- mode
  // What the response is: the user's choice, never guessed from the response.

  function applyMode() {
    for (const b of document.querySelectorAll('#mode-control [data-mode]')) {
      const on = b.dataset.mode === state.mode;
      b.setAttribute('aria-checked', String(on));
      b.tabIndex = on ? 0 : -1;
      b.title = tr('modeHint')[b.dataset.mode];
    }
  }

  function setMode(id, analyse = true) {
    if (id === state.mode) return;
    state.mode = HL.profiles.getMode(id).id;
    storage.set('mode', state.mode);
    applyMode();
    if (analyse) runAnalysis(true);
  }

  function initSegmented(container, onSelect) {
    container.addEventListener('click', (e) => {
      const b = e.target.closest('button[role="radio"]');
      if (b) onSelect(b);
    });
    container.addEventListener('keydown', (e) => {
      const keys = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
      if (!(e.key in keys)) return;
      e.preventDefault();
      const items = [...container.querySelectorAll('button[role="radio"]')];
      const i = items.indexOf(document.activeElement);
      const next = items[(i + keys[e.key] + items.length) % items.length];
      next.focus();
      onSelect(next);
    });
  }

  // ------------------------------------------------------------------ menus

  let openMenu = null;

  function closeMenu(focusButton) {
    if (!openMenu) return;
    const { menu, button } = openMenu;
    menu.hidden = true;
    button.setAttribute('aria-expanded', 'false');
    openMenu = null;
    if (focusButton) button.focus();
  }

  function initMenu(button, menu, onAction) {
    const items = () => [...menu.querySelectorAll('button:not(:disabled)')];

    button.addEventListener('click', () => {
      if (openMenu && openMenu.menu === menu) { closeMenu(false); return; }
      closeMenu(false);
      menu.hidden = false;
      button.setAttribute('aria-expanded', 'true');
      openMenu = { menu, button };
      const first = items()[0];
      if (first) first.focus();
    });
    menu.addEventListener('click', (e) => {
      const item = e.target.closest('button');
      if (!item) return;
      closeMenu(true);
      onAction(item);
    });
    menu.addEventListener('keydown', (e) => {
      const list = items();
      const i = list.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') { e.preventDefault(); list[(i + 1) % list.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); list[(i - 1 + list.length) % list.length].focus(); }
      else if (e.key === 'Home') { e.preventDefault(); list[0].focus(); }
      else if (e.key === 'End') { e.preventDefault(); list[list.length - 1].focus(); }
      else if (e.key === 'Escape') { e.preventDefault(); closeMenu(true); }
      else if (e.key === 'Tab') { closeMenu(false); }
    });
  }

  document.addEventListener('pointerdown', (e) => {
    if (openMenu && !openMenu.menu.contains(e.target) && !openMenu.button.contains(e.target)) closeMenu(false);
  });

  // --------------------------------------------------------------- analysis

  let debounce = 0;
  function scheduleAnalysis() {
    clearTimeout(debounce);
    const size = $('input').value.length;
    debounce = setTimeout(() => runAnalysis(false), size > 200000 ? 350 : 120);
  }

  /** `keepDecisions`: the same response read again in another language, so the checks recorded still apply. */
  function runAnalysis(force, keepDecisions) {
    const text = $('input').value;
    $('clear-button').disabled = text === '';
    if (!force && text === state.lastInput) return;
    state.lastInput = text;

    const report = core().analyze(text, state.profile, state.mode);
    state.report = report;
    if (!keepDecisions) state.decisions.clear();
    render();
    if (report.ok) {
      const s = report.summary;
      const issues = report.results.filter((r) => worstSeverity(r) >= Severity.LOW).length;
      announce(tr('analysisUpdated', s.worstIsContingent, SEV_LABEL[s.worst], issues));
    }
  }

  // ---------------------------------------------------------------- render

  function render() {
    const root = $('results-root');
    try {
      root.replaceChildren(...buildResults(state.report));
    } catch (e) {
      root.replaceChildren(errorState(tr('drawFailedTitle'), tr('drawFailed'), e && e.stack ? e.stack : String(e)));
    }
  }

  function emptyState() {
    return el('div', { className: 'card empty-state' },
      el('span', { className: 'empty-icon' }, icon('i-inbox')),
      el('h3', { text: tr('emptyTitle') }),
      el('p', { text: tr('empty') }),
      el('button', {
        className: 'filled-button',
        attrs: { type: 'button' },
        on: { click: () => loadText(HL.samples.find((x) => x.id === 'legacy').text) },
      }, icon('i-sparkles'), tr('trySample')));
  }

  function errorState(title, message, detail) {
    return el('div', { className: 'card empty-state error', attrs: { role: 'alert' } },
      el('span', { className: 'empty-icon' }, icon('i-error')),
      el('h3', { text: title }),
      el('p', { text: message }),
      detail ? el('details', null, el('summary', { text: tr('technicalDetails') }), el('pre', { text: detail })) : null);
  }

  function buildResults(report) {
    if (!report || report.error === 'empty') return [emptyState()];
    if (report.error === 'internal') {
      return [errorState(tr('internalTitle'), tr('internal'), firstLine(report.detail))];
    }
    if (!report.ok) return [errorState(tr('nothingToAnalyse'), report.error)];

    const nodes = [];
    if (report.notes.length) nodes.push(notesCard(report.notes));
    const view = core().resolve(report, state.decisions);
    nodes.push(filterBar(report, view));
    nodes.push(...listSections(report, view));
    return nodes;
  }

  function firstLine(detail) {
    return String(detail || '').split('\n').slice(0, 6).join('\n');
  }

  /**
   * The findings list for a report: one `- <Header>: <status>. <brief>.` line
   * per header, copied from a menu. All, only the findings the response
   * settles, or only those to confirm.
   */
  const LIST_SHOW = [
    ['all', 'showAll', 'showAllDetail'],
    ['confirmed', 'showConfirmed', 'showConfirmedDetail'],
    ['toConfirm', 'showToConfirm', 'showToConfirmDetail'],
  ];

  function copyMenu(report) {
    const button = el('button', {
      className: 'tonal-button',
      attrs: { type: 'button', 'aria-haspopup': 'menu', 'aria-expanded': 'false', 'aria-controls': 'copy-menu', id: 'copy-button' },
    }, icon('i-copy'), tr('copyFindings'), icon('i-expand', 'trailing'));
    const menu = el('div', { className: 'menu', attrs: { id: 'copy-menu', role: 'menu', 'aria-labelledby': 'copy-button' } });
    menu.hidden = true;
    for (const [id, label, detail] of LIST_SHOW) {
      const count = core().findingList(report, { show: id }).length;
      menu.append(el('button', {
        className: 'two-line',
        attrs: { type: 'button', role: 'menuitem', 'data-show': id, disabled: !count },
      }, el('span', null, `${tr(label)} · ${count}`, el('span', { className: 'menu-detail', text: tr(detail) }))));
    }
    initMenu(button, menu, (item) => {
      const lines = core().findingList(report, { show: item.dataset.show });
      const done = { all: tr('copiedAll', lines.length), confirmed: tr('copiedConfirmed', lines.length), toConfirm: tr('copiedToConfirm', lines.length) }[item.dataset.show];
      copyText(lines.map((l) => `- ${l.text}`).join('\n'), done);
    });
    return el('div', { className: 'menu-anchor copy-anchor' }, button, menu);
  }

  function notesCard(notes) {
    const details = el('details', { className: 'card notes' },
      el('summary', null, icon('i-info', 'lead'), el('span', { text: tr('readingNotes', notes.length) }), icon('i-expand', 'chev')),
      el('ul', null, notes.map((n) => el('li', { text: n }))));
    if (notes.some((n) => /request|informational/.test(n))) details.open = true;
    return details;
  }

  /**
   * `r` is the result as the user's decisions leave it, `raw` as analysed.
   * "To confirm" keeps showing a row after its checks are decided, so the
   * decisions stay in view and can be changed.
   */
  function matchesFilter(r, raw) {
    if (state.filter === 'issues' && worstSeverity(r) < Severity.LOW) return false;
    if (state.filter === 'confirm' && !raw.findings.some(isContingent)) return false;
    if (state.query) {
      const q = state.query.toLowerCase();
      const hay = [raw.name, raw.value || '', ...raw.findings.map((f) => f.title)].join('\n').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }

  function filterBar(report, view) {
    const counts = {
      all: report.results.length,
      issues: view.results.filter((r) => worstSeverity(r) >= Severity.LOW).length,
      confirm: report.results.filter((r) => r.findings.some(isContingent)).length,
    };
    // M3 filter chips behaving as a single-choice group.
    const chips = el('div', { className: 'chip-set', attrs: { role: 'radiogroup', 'aria-label': tr('show') } });
    for (const [id, label] of [['all', tr('all')], ['issues', tr('issues')], ['confirm', tr('toConfirm')]]) {
      chips.append(el('button', {
        className: 'filter-chip',
        attrs: { type: 'button', role: 'radio', 'aria-checked': String(state.filter === id), tabindex: state.filter === id ? 0 : -1, 'data-filter': id },
      }, icon('i-check', 'chip-check'), `${label} · ${counts[id]}`));
    }
    initSegmented(chips, (b) => {
      if (state.filter === b.dataset.filter) return;
      state.filter = b.dataset.filter;
      render();
      const again = document.querySelector(`[data-filter="${state.filter}"]`);
      if (again) again.focus();
    });

    const input = el('input', {
      attrs: { type: 'search', placeholder: tr('search'), 'aria-label': tr('search'), value: state.query, id: 'search-input', autocomplete: 'off', spellcheck: 'false' },
    });
    input.addEventListener('input', () => {
      state.query = input.value.trim();
      for (const n of document.querySelectorAll('.result-section')) n.remove();
      $('results-root').append(...listSections(state.report, core().resolve(state.report, state.decisions)));
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && input.value) { e.stopPropagation(); input.value = ''; input.dispatchEvent(new Event('input')); }
    });
    return el('div', { className: 'filter-bar' },
      el('label', { className: 'search-bar' }, icon('i-search'), input),
      el('div', { className: 'filter-row' }, chips, copyMenu(view)));
  }

  function listSections(report, view) {
    const rows = view.results
      .map((r, order) => ({ r, raw: report.results[order], order, worst: worstSeverity(r) }))
      .filter(({ r, raw }) => matchesFilter(r, raw))
      .sort((a, b) => b.worst - a.worst || a.order - b.order);

    if (!rows.length) {
      return [el('div', { className: 'card no-match result-section', text: state.query ? tr('noMatch', state.query) : tr('nothingInView') })];
    }
    const bands = [
      [tr('issues'), (w) => w >= Severity.LOW],
      [tr('passing'), (w) => w === Severity.OK],
    ];
    const out = [];
    for (const [title, test] of bands) {
      const group = rows.filter(({ worst }) => test(worst));
      if (!group.length) continue;
      out.push(el('section', { className: 'result-section', attrs: { 'aria-label': title } },
        el('h3', { className: 'section-header' }, title, el('span', { className: 'section-count', text: String(group.length) })),
        el('div', { className: 'card list', attrs: { role: 'list' } }, group.map(({ r, raw }) => resultRow(r, raw)))));
    }
    return out;
  }

  /** `r` drives the row's badges, as the user's decisions leave it; `raw` lists every finding with its decision. */
  function resultRow(r, raw) {
    const worst = worstSeverity(r);
    const contingent = resultIsContingent(r);
    const absent = r.value === null;
    const empty = r.value !== null && r.value.trim() === '';

    const summary = el('summary', null,
      avatar(worst, contingent),
      el('div', { className: 'row-text' },
        el('div', { className: 'row-name', text: r.name }),
        el('div', { className: `row-value${absent || empty ? ' absent' : ''}`, text: absent ? tr('notPresent') : empty ? tr('emptyValue') : r.value })),
      el('span', { className: 'row-badges' }, badge(worst, contingent), toConfirmMarker(r, contingent)),
      icon('i-expand', 'row-chevron'));

    const detail = el('div', { className: 'row-detail' });
    if (absent) {
      detail.append(el('div', { className: 'value-block absent', text: tr('notSent') }));
    } else {
      detail.append(el('div', { className: 'value-block' },
        el('code', { text: empty ? '(empty)' : r.value }),
        el('button', {
          className: 'icon-button small',
          attrs: { type: 'button', title: tr('copyValue'), 'aria-label': tr('copyValueOf', r.name) },
          on: { click: () => copyText(r.value, tr('valueCopied')) },
        }, icon('i-copy'))));
    }
    const indexed = raw.findings.map((f, i) => ({ f, key: core().decisionKey(raw, i) }));
    const shown = indexed.filter(({ f }) => f.severity > Severity.OK || f.description || f.recommendation);
    const findings = (shown.length ? shown : indexed).slice().sort((a, b) => b.f.severity - a.f.severity);
    if (!findings.length) {
      detail.append(el('p', { className: 'finding-desc', text: absent ? tr('correctAbsent') : tr('nothingToReport') }));
    }
    for (const { f, key } of findings) detail.append(findingNode(f, key));

    const details = el('details', { className: 'row', attrs: { role: 'listitem', 'data-key': r.key } }, summary, detail);
    if (state.open.has(r.key)) details.open = true;
    details.addEventListener('toggle', () => {
      if (details.open) state.open.add(r.key); else state.open.delete(r.key);
    });
    return details;
  }

  const DECISION_LABEL = { confirmed: 'confirmedManually', excluded: 'excluded' };

  /**
   * A finding with a severity carries its badge; an OK finding is a note:
   * explained, never graded. A finding to confirm also carries the user's
   * decision: confirmed (settled from now on) or excluded (dropped).
   */
  function findingNode(f, key) {
    const note = f.severity === Severity.OK;
    const contingent = isContingent(f);
    const decision = contingent ? state.decisions.get(key) : undefined;
    const node = el('div', { className: `finding${note ? ' note' : ''}${decision ? ' decided-' + decision : ''}` },
      el('div', { className: 'finding-head' },
        note ? icon('i-info', 'note-icon') : badge(f.severity, contingent && decision !== 'confirmed'),
        el('span', { className: 'finding-title', text: f.title })));
    if (f.description) node.append(el('p', { className: 'finding-desc', text: f.description }));
    if (f.verify) {
      const label = note ? tr('check') : tr(DECISION_LABEL[decision] || 'toConfirm');
      node.append(el('div', { className: 'callout verify' }, icon(decision === 'confirmed' ? 'i-check' : 'i-help'),
        el('div', null, el('span', { className: 'callout-label', text: label }), el('p', { className: 'check-question', text: f.verify }), outcomes(f, note))));
    }
    if (contingent) node.append(decisionChips(key, decision));
    if (f.recommendation) {
      node.append(el('div', { className: 'callout rec' }, icon('i-bulb'),
        el('div', null, el('span', { className: 'callout-label', text: tr('recommendation') }), f.recommendation)));
    }
    if (f.sources.length) node.append(sourcesNode(f.sources));
    return node;
  }

  /**
   * The two answers to a check, one per line. On a finding to confirm they
   * read as the buttons below it; on an OK note, the problem a check would
   * show and its absence.
   */
  function outcomes(f, note) {
    const rows = note
      ? [['i-check', tr('fineIf'), f.excludeIf], ['i-close', tr('problemIf'), f.confirmIf]]
      : [['i-check', tr('confirmedIf'), f.confirmIf], ['i-close', tr('excludedIf'), f.excludeIf]];
    return el('ul', { className: 'check-outcomes' }, rows.filter(([, , text]) => text).map(([ic, label, text]) =>
      el('li', null, icon(ic), el('span', null, el('strong', { text: `${label}: ` }), text))));
  }

  /** Two toggles under a finding to confirm; pressing the active one again reopens it. */
  function decisionChips(key, decision) {
    const set = el('div', { className: 'chip-set decision-set', attrs: { role: 'group', 'aria-label': tr('checkResult') } });
    for (const [value, label] of [['confirmed', tr('confirmed')], ['excluded', tr('excluded')]]) {
      set.append(el('button', {
        className: 'filter-chip',
        attrs: { type: 'button', 'aria-pressed': String(decision === value), 'data-decision': `${key}|${value}` },
        on: { click: () => decide(key, decision === value ? null : value) },
      }, icon('i-check', 'chip-check'), label));
    }
    return set;
  }

  function decide(key, value) {
    if (value) state.decisions.set(key, value); else state.decisions.delete(key);
    render();
    const again = document.querySelector(`[data-decision="${CSS.escape(key)}|${value || 'confirmed'}"]`);
    if (again) again.focus();
    announce(value === 'confirmed' ? tr('markedConfirmed') : value === 'excluded' ? tr('markedExcluded') : tr('backToConfirm'));
  }

  /**
   * The passages a finding rests on. Each link carries a text fragment, so the
   * page opens scrolled to the quoted passage with it highlighted.
   */
  function sourcesNode(ids) {
    const items = ids.map((id) => {
      const c = HL.sources.cite(id);
      return el('li', null,
        el('a', {
          className: 'source-link',
          attrs: { href: c.url, target: '_blank', rel: 'noopener noreferrer', referrerpolicy: 'no-referrer' },
        }, el('span', { text: c.title }), icon('i-open', 'source-open')),
        el('q', { className: 'source-quote', text: c.quote }));
    });
    return el('details', { className: 'sources' },
      el('summary', null, icon('i-expand', 'chev'), el('span', { text: tr('sources', ids.length) })),
      el('ol', null, items));
  }

  // ------------------------------------------------------------------ input

  function loadText(text) {
    const input = $('input');
    input.value = text;
    input.scrollTop = 0;
    state.open.clear();
    runAnalysis(true);
  }

  /** Copy through the old selection API, for pages where the clipboard API is refused. */
  function copyBySelection(text) {
    const ta = el('textarea', { attrs: { readonly: true, 'aria-hidden': 'true' } });
    ta.value = text;
    ta.className = 'visually-hidden';
    document.body.append(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
    ta.remove();
    return ok;
  }

  /** Last resort: the text in a dialog, already selected, to copy by hand. */
  function manualCopy(text) {
    const area = el('textarea', { className: 'manual-copy-text', attrs: { readonly: true, rows: 10, 'aria-label': tr('textToCopy') } });
    area.value = text;
    const dialog = el('dialog', { className: 'manual-copy', attrs: { 'aria-labelledby': 'manual-copy-title' } },
      el('h3', { text: tr('copyManually'), attrs: { id: 'manual-copy-title' } }),
      el('p', { className: 'subtitle', text: tr('clipboardRefused') }),
      area,
      el('div', { className: 'dialog-actions' },
        el('button', { className: 'filled-button', text: tr('close'), attrs: { type: 'button' }, on: { click: () => dialog.close() } })));
    dialog.addEventListener('close', () => dialog.remove());
    document.body.append(dialog);
    dialog.showModal();
    area.focus();
    area.select();
  }

  async function copyText(text, done) {
    let ok = false;
    if (navigator.clipboard && window.isSecureContext) {
      try { await navigator.clipboard.writeText(text); ok = true; } catch (_) { ok = false; }
    }
    if (!ok) ok = copyBySelection(text);
    if (ok) toast(done);
    else manualCopy(text);
  }

  // ------------------------------------------------------------------- init

  /** The samples menu, in the current language. */
  function fillSamples() {
    $('samples-menu').replaceChildren(...HL.samples.map((s) => {
      const label = (s.label && s.label[state.lang]) || s.label.en;
      return el('button', { className: 'two-line', attrs: { type: 'button', role: 'menuitem', 'data-sample': s.id } },
        icon('i-sparkles'), el('span', null, label.name, el('span', { className: 'menu-detail', text: label.detail })));
    }));
  }

  /**
   * The static page in the current language: elements carry data-i18n (their
   * text) or data-i18n-attr ("attribute:key; ..."), keys of UI_TEXT.
   */
  function applyLanguage() {
    document.documentElement.lang = state.lang;
    for (const n of document.querySelectorAll('[data-i18n]')) n.textContent = tr(n.dataset.i18n);
    for (const n of document.querySelectorAll('[data-i18n-attr]')) {
      for (const pair of n.dataset.i18nAttr.split(';')) {
        const [attr, key] = pair.split(':').map((x) => x.trim());
        if (attr && key) n.setAttribute(attr, tr(key));
      }
    }
    for (const b of document.querySelectorAll('#lang-control [data-lang]')) {
      const on = b.dataset.lang === state.lang;
      b.setAttribute('aria-checked', String(on));
      b.tabIndex = on ? 0 : -1;
    }
    applyTheme();
    applyProfile();
    applyMode();
    fillSamples();
  }

  function setLang(lang) {
    if (lang === state.lang) return;
    state.lang = HL.i18n.LANGS.includes(lang) ? lang : HL.i18n.DEFAULT_LANG;
    storage.set('lang', state.lang);
    applyLanguage();
    runAnalysis(true, true);
  }

  function init() {
    state.lang = initialLang();
    applyLanguage();
    applyTheme();
    applyProfile();
    applyMode();

    const input = $('input');
    input.addEventListener('input', scheduleAnalysis);

    initSegmented($('profile-control'), (b) => setProfile(b.dataset.profile));
    initSegmented($('mode-control'), (b) => setMode(b.dataset.mode));

    const samplesMenu = $('samples-menu');
    fillSamples();
    initMenu($('samples-button'), samplesMenu, (item) => {
      const s = HL.samples.find((x) => x.id === item.dataset.sample);
      if (s) {
        if (s.mode) setMode(s.mode, false);
        loadText(s.text);
      }
    });
    initSegmented($('lang-control'), (b) => setLang(b.dataset.lang));
    $('theme-button').addEventListener('click', () => {
      storage.set('theme', currentTheme() === 'dark' ? 'light' : 'dark');
      applyTheme();
    });
    if (systemDark && systemDark.addEventListener) systemDark.addEventListener('change', () => { if (!savedTheme()) applyTheme(); });

    $('clear-button').addEventListener('click', () => { loadText(''); input.focus(); });

    // Files are not opened. A file dropped by mistake would make the browser
    // navigate to it and lose what was pasted, so the drop is caught and refused.
    const isFileDrag = (e) => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
    window.addEventListener('dragover', (e) => { if (isFileDrag(e)) e.preventDefault(); });
    window.addEventListener('drop', (e) => {
      if (!isFileDrag(e)) return;
      e.preventDefault();
      toast(tr('noFiles'));
    });

    document.addEventListener('keydown', (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (e.key === 'Escape' && openMenu) {
        closeMenu(true);
      } else if (e.key === '/' && !mod && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
        const search = $('search-input');
        if (search) { e.preventDefault(); search.focus(); }
      }
    });

    // M3 top app bar: it takes the surface-container tone once content scrolls under it.
    const bar = document.querySelector('.top-app-bar');
    const onScroll = () => bar.classList.toggle('scrolled', window.scrollY > 0);
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    window.addEventListener('error', (e) => {
      // Something escaped every handler: say so rather than fail silently.
      toast(tr('crashed'));
      if (window.console) console.error(e.error || e.message);
    });

    runAnalysis(true);
  }

  // This script comes last in the body, so the page it fills is already
  // parsed: running now, rather than at DOMContentLoaded, puts the chosen
  // language on screen before the first paint.
  if ($('results-root')) init();
  else document.addEventListener('DOMContentLoaded', init);
})(globalThis.HeaderAnalyzer = globalThis.HeaderAnalyzer || {});

  </script>
</body>
</html>
