/*
 * Header Analyzer: interface styles after Google's Material Design 3.
 *
 * Colour comes from the M3 baseline tonal scheme (light and dark), expressed
 * as colour roles; severities are extra "custom colours" built the same way
 * (colour / container / on-container). Shapes, type scale, elevation and
 * state layers follow the M3 tokens. Severity is always also written as a
 * word, never carried by colour alone.
 */

:root {
  color-scheme: light;
  --md-primary: #6750a4;
  --md-on-primary: #ffffff;
  --md-primary-container: #eaddff;
  --md-on-primary-container: #21005d;
  --md-secondary-container: #e8def8;
  --md-on-secondary-container: #1d192b;
  --md-tertiary-container: #ffd8e4;
  --md-on-tertiary-container: #31111d;
  --md-error: #b3261e;
  --md-on-error: #ffffff;
  --md-error-container: #f9dedc;
  --md-on-error-container: #410e0b;
  --md-surface: #fef7ff;
  --md-on-surface: #1d1b20;
  --md-on-surface-variant: #49454f;
  --md-outline: #79747e;
  --md-outline-variant: #cac4d0;
  --md-surface-container-lowest: #ffffff;
  --md-surface-container-low: #f7f2fa;
  --md-surface-container: #f3edf7;
  --md-surface-container-high: #ece6f0;
  --md-surface-container-highest: #e6e0e9;
  --md-inverse-surface: #322f35;
  --md-inverse-on-surface: #f5eff7;
  --md-inverse-primary: #d0bcff;
  --md-logo-accent: #6750a4;

  /* Severity custom colours: colour / container / on-container */
  --sev-high: #b3261e;      --sev-high-c: #f9dedc;      --sev-high-on: #410e0b;
  --sev-medium: #8b5000;    --sev-medium-c: #ffdcbe;    --sev-medium-on: #2c1600;
  --sev-low: #6d5e00;       --sev-low-c: #f8e287;       --sev-low-on: #221b00;
  --sev-ok: #146c2e;        --sev-ok-c: #b7f1b9;        --sev-ok-on: #002107;

  --elev-1: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 3px 1px rgba(0, 0, 0, 0.15);
  --elev-2: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 6px 2px rgba(0, 0, 0, 0.15);
  --elev-3: 0 1px 3px rgba(0, 0, 0, 0.3), 0 4px 8px 3px rgba(0, 0, 0, 0.15);

  --font: Roboto, "Roboto Flex", "Google Sans Text", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --mono: "Roboto Mono", ui-monospace, "SF Mono", Menlo, "DejaVu Sans Mono", Consolas, monospace;
  --ease: cubic-bezier(0.2, 0, 0, 1);           /* M3 emphasized */
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --md-primary: #d0bcff;
    --md-on-primary: #381e72;
    --md-primary-container: #4f378b;
    --md-on-primary-container: #eaddff;
    --md-secondary-container: #4a4458;
    --md-on-secondary-container: #e8def8;
    --md-tertiary-container: #633b48;
    --md-on-tertiary-container: #ffd8e4;
    --md-error: #f2b8b5;
    --md-on-error: #601410;
    --md-error-container: #8c1d18;
    --md-on-error-container: #f9dedc;
    --md-surface: #141218;
    --md-on-surface: #e6e0e9;
    --md-on-surface-variant: #cac4d0;
    --md-outline: #938f99;
    --md-outline-variant: #49454f;
    --md-surface-container-lowest: #0f0d13;
    --md-surface-container-low: #1d1b20;
    --md-surface-container: #211f26;
    --md-surface-container-high: #2b2930;
    --md-surface-container-highest: #36343b;
    --md-inverse-surface: #e6e0e9;
    --md-inverse-on-surface: #322f35;
    --md-inverse-primary: #6750a4;
    --md-logo-accent: #d0bcff;
    --sev-high: #f2b8b5;      --sev-high-c: #8c1d18;      --sev-high-on: #f9dedc;
    --sev-medium: #ffb870;    --sev-medium-c: #6a3c00;    --sev-medium-on: #ffdcbe;
    --sev-low: #dbc66e;       --sev-low-c: #524600;       --sev-low-on: #f8e287;
    --sev-ok: #9cd49f;        --sev-ok-c: #005321;        --sev-ok-on: #b7f1b9;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --md-primary: #d0bcff;
  --md-on-primary: #381e72;
  --md-primary-container: #4f378b;
  --md-on-primary-container: #eaddff;
  --md-secondary-container: #4a4458;
  --md-on-secondary-container: #e8def8;
  --md-tertiary-container: #633b48;
  --md-on-tertiary-container: #ffd8e4;
  --md-error: #f2b8b5;
  --md-on-error: #601410;
  --md-error-container: #8c1d18;
  --md-on-error-container: #f9dedc;
  --md-surface: #141218;
  --md-on-surface: #e6e0e9;
  --md-on-surface-variant: #cac4d0;
  --md-outline: #938f99;
  --md-outline-variant: #49454f;
  --md-surface-container-lowest: #0f0d13;
  --md-surface-container-low: #1d1b20;
  --md-surface-container: #211f26;
  --md-surface-container-high: #2b2930;
  --md-surface-container-highest: #36343b;
  --md-inverse-surface: #e6e0e9;
  --md-inverse-on-surface: #322f35;
  --md-inverse-primary: #6750a4;
  --md-logo-accent: #d0bcff;
  --sev-high: #f2b8b5;      --sev-high-c: #8c1d18;      --sev-high-on: #f9dedc;
  --sev-medium: #ffb870;    --sev-medium-c: #6a3c00;    --sev-medium-on: #ffdcbe;
  --sev-low: #dbc66e;       --sev-low-c: #524600;       --sev-low-on: #f8e287;
  --sev-ok: #9cd49f;        --sev-ok-c: #005321;        --sev-ok-on: #b7f1b9;
}

/* Map each severity class onto three local variables, used by every component. */
.sev-high     { --c: var(--sev-high);     --cc: var(--sev-high-c);     --con: var(--sev-high-on); }
.sev-medium   { --c: var(--sev-medium);   --cc: var(--sev-medium-c);   --con: var(--sev-medium-on); }
.sev-low      { --c: var(--sev-low);      --cc: var(--sev-low-c);      --con: var(--sev-low-on); }
.sev-ok       { --c: var(--sev-ok);       --cc: var(--sev-ok-c);       --con: var(--sev-ok-on); }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--md-surface);
  color: var(--md-on-surface);
  font: 400 14px/20px var(--font);       /* body-medium */
  letter-spacing: 0.25px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
code { font-family: var(--mono); font-size: 0.92em; letter-spacing: 0; }
h1, h2, h3 { margin: 0; font-weight: 400; }
p { margin: 0; }
svg { fill: currentColor; }

:focus-visible { outline: 3px solid var(--md-primary); outline-offset: 2px; }

.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.visually-hidden {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip-link {
  position: absolute; left: 16px; top: -60px; z-index: 100;
  padding: 10px 24px; border-radius: 20px;
  background: var(--md-primary); color: var(--md-on-primary);
  font-weight: 500; text-decoration: none;
}
.skip-link:focus { top: 12px; }

/* State layer: the M3 hover/press overlay, in the content colour. */
.icon-button, .filled-button, .tonal-button, .filter-chip, .segmented button, .menu button,
.row > summary, .notes summary, .sources > summary {
  position: relative; isolation: isolate;
}
.icon-button::after, .filled-button::after, .tonal-button::after, .filter-chip::after, .segmented button::after,
.menu button::after, .row > summary::after, .notes summary::after, .sources > summary::after {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
  background: currentColor; opacity: 0; transition: opacity 0.15s linear; pointer-events: none;
}
:is(.icon-button, .filled-button, .tonal-button, .filter-chip, .segmented button, .menu button, .row > summary, .notes summary, .sources > summary):hover:not(:disabled)::after { opacity: 0.08; }
:is(.icon-button, .filled-button, .tonal-button, .filter-chip, .segmented button, .menu button, .row > summary, .notes summary, .sources > summary):focus-visible::after { opacity: 0.1; }
:is(.icon-button, .filled-button, .tonal-button, .filter-chip, .segmented button, .menu button, .row > summary, .notes summary, .sources > summary):active:not(:disabled)::after { opacity: 0.12; }

/* ---------------------------------------------------------- Top app bar */

.top-app-bar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 16px;
  min-height: 64px;
  padding: 8px max(8px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
  background: var(--md-surface);
  transition: background-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
}
.top-app-bar.scrolled { background: var(--md-surface-container); box-shadow: var(--elev-2); }
.app-bar-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
.app-bar-title h1 { font-size: 22px; line-height: 28px; letter-spacing: 0; white-space: nowrap; }     /* title-large */
/* Light/dark switch: the icon shows the theme a click switches to. */
.theme-toggle .ic-light { display: none; }
:root[data-theme="dark"] .theme-toggle .ic-light { display: block; }
:root[data-theme="dark"] .theme-toggle .ic-dark { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .theme-toggle .ic-light { display: block; }
  :root:not([data-theme="light"]) .theme-toggle .ic-dark { display: none; }
}
.app-logo {
  display: grid; place-items: center; width: 36px; height: 40px; flex: none;
  color: var(--md-on-surface);
}
.app-logo svg { width: 34px; height: 25.5px; stroke: var(--md-logo-accent); }   /* the "value" stroke after "H:" inherits this */
.app-bar-actions { display: flex; align-items: center; gap: 0; margin-left: auto; }

.icon-button {
  display: inline-grid; place-items: center; width: 40px; height: 40px; flex: none;
  padding: 0; border: 0; border-radius: 50%;
  background: transparent; color: var(--md-on-surface-variant);
}
.icon-button svg { width: 24px; height: 24px; }
.icon-button:disabled { color: var(--md-on-surface); opacity: 0.38; }
.icon-button[aria-expanded="true"] { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
.icon-button.small { width: 32px; height: 32px; }
.icon-button.small svg { width: 18px; height: 18px; }

/* Segmented button */
.segmented { display: inline-flex; flex: none; height: 40px; }
.segmented button {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-width: 108px; padding: 0 16px;
  border: 1px solid var(--md-outline); background: transparent; color: var(--md-on-surface);
  font-size: 14px; font-weight: 500; line-height: 20px; letter-spacing: 0.1px;   /* label-large */
}
.segmented button:first-child { border-radius: 20px 0 0 20px; }
.segmented button:last-child { border-radius: 0 20px 20px 0; }
.segmented button + button { margin-left: -1px; }
.segmented button[aria-checked="true"] { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
.seg-check { width: 18px; height: 18px; display: none; }
.segmented button[aria-checked="true"] .seg-check { display: block; color: var(--md-primary); }

/* Menus */
.menu-anchor { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 30;
  min-width: 220px; max-width: 320px; padding: 8px 0;
  border-radius: 4px; background: var(--md-surface-container);
  box-shadow: var(--elev-2);
  transform-origin: top right; animation: menu-in 0.2s var(--ease);
}
@keyframes menu-in { from { opacity: 0; transform: scale(0.92, 0.6); } }
.menu button {
  display: flex; align-items: center; gap: 12px; width: 100%;
  min-height: 48px; padding: 0 16px 0 12px;
  border: 0; background: transparent; color: var(--md-on-surface);
  text-align: left; font-size: 14px; font-weight: 500; letter-spacing: 0.1px;
}
.menu button svg { width: 24px; height: 24px; flex: none; color: var(--md-on-surface-variant); }
.menu button:focus-visible { outline: none; }
.menu button.two-line { min-height: 56px; padding-top: 8px; padding-bottom: 8px; }
.menu .menu-detail { display: block; font-size: 12px; font-weight: 400; line-height: 16px; letter-spacing: 0.4px; color: var(--md-on-surface-variant); }

/* ----------------------------------------------------------------- Layout */

.layout {
  display: grid;
  grid-template-columns: minmax(340px, 5fr) minmax(0, 7fr);
  gap: 24px;
  max-width: 1480px; margin: 0 auto;
  padding: 8px max(24px, env(safe-area-inset-right)) 48px max(24px, env(safe-area-inset-left));
}
.input-pane { position: sticky; top: 80px; align-self: start; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.results-pane { min-width: 0; outline: none; }

.card { position: relative; border-radius: 12px; background: var(--md-surface-container-low); }

/* ------------------------------------------------------------------ Input */

.input-card { display: flex; flex-direction: column; padding: 16px; }
.card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
.card-header h2 { font-size: 22px; line-height: 28px; }
.subtitle { margin-top: 2px; font-size: 14px; line-height: 20px; color: var(--md-on-surface-variant); }

/* Outlined text field with a floating label */
.text-field { position: relative; }
#input {
  display: block; width: 100%;
  height: clamp(220px, calc(100vh - 400px), 620px);
  margin: 0; padding: 16px;
  border: 1px solid var(--md-outline); border-radius: 4px;
  outline: none; resize: vertical;
  background: transparent;
  font: 13px/20px var(--mono); letter-spacing: 0;
  tab-size: 4; white-space: pre; overflow: auto;
  transition: border-color 0.15s linear;
}
#input:hover { border-color: var(--md-on-surface); }
#input:focus { border: 2px solid var(--md-primary); padding: 15px; }
.text-field label {
  position: absolute; left: 12px; top: 16px; padding: 0 4px;
  background: var(--md-surface-container-low); color: var(--md-on-surface-variant);
  font-size: 16px; line-height: 20px; letter-spacing: 0.5px;
  pointer-events: none; transform-origin: left top;
  transition: transform 0.2s var(--ease), color 0.2s linear;
}
#input:focus + label, #input:not(:placeholder-shown) + label { transform: translateY(-24px) scale(0.75); }
#input:focus + label { color: var(--md-primary); }





/* --------------------------------------------------------------- Buttons */

.filled-button {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 24px; border: 0; border-radius: 20px;
  font-size: 14px; font-weight: 500; line-height: 20px; letter-spacing: 0.1px;
}
.filled-button { background: var(--md-primary); color: var(--md-on-primary); padding-left: 16px; transition: box-shadow 0.15s linear; }
.filled-button:hover { box-shadow: var(--elev-1); }
.filled-button svg { width: 18px; height: 18px; }
/* M3 filled tonal button: a secondary action that still stands out. */
.tonal-button {
  display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px;
  border: 0; border-radius: 20px; background: var(--md-secondary-container); color: var(--md-on-secondary-container);
  font-size: 14px; font-weight: 500; line-height: 20px; letter-spacing: 0.1px;
}
.tonal-button svg { width: 18px; height: 18px; fill: currentColor; }
.tonal-button .trailing { margin-right: -4px; transition: transform 0.2s var(--ease); }
.tonal-button[aria-expanded="true"] .trailing { transform: rotate(180deg); }

/* ---------------------------------------------------------------- Results */

#results-root { display: flex; flex-direction: column; gap: 16px; }

.empty-state {
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px;
  min-height: 440px; justify-content: center; padding: 40px 24px;
}
.empty-icon {
  display: grid; place-items: center; width: 96px; height: 96px; margin-bottom: 8px;
  border-radius: 28px; background: var(--md-primary-container); color: var(--md-on-primary-container);
}
.empty-icon svg { width: 48px; height: 48px; }
.empty-state h3 { font-size: 24px; line-height: 32px; }                 /* headline-small */
.empty-state p { max-width: 420px; font-size: 14px; color: var(--md-on-surface-variant); }
.empty-state .filled-button { margin-top: 12px; }
.empty-state.error .empty-icon { background: var(--md-error-container); color: var(--md-on-error-container); }
.empty-state details { max-width: 100%; text-align: left; }
.empty-state details summary { cursor: pointer; font-weight: 500; color: var(--md-primary); }
.empty-state pre { max-width: 100%; overflow: auto; margin: 8px 0 0; padding: 12px; border-radius: 8px; background: var(--md-surface-container-highest); font: 11px/1.5 var(--mono); }

.row { scroll-margin-top: 88px; }

/* Notes */
.notes { overflow: hidden; }
.notes summary {
  display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 0 16px;
  list-style: none; cursor: pointer; font-size: 16px; line-height: 24px; letter-spacing: 0.15px; font-weight: 500;
  border-radius: 12px;
}
.notes summary::-webkit-details-marker { display: none; }
.notes summary .lead { width: 24px; height: 24px; color: var(--md-primary); flex: none; }
.notes summary .chev { width: 24px; height: 24px; margin-left: auto; color: var(--md-on-surface-variant); transition: transform 0.2s var(--ease); }
.notes[open] summary .chev { transform: rotate(180deg); }
.notes ul { margin: 0; padding: 0 24px 16px 56px; color: var(--md-on-surface-variant); }
.notes li + li { margin-top: 6px; }

/* Search bar and filter chips */
.filter-bar { position: relative; z-index: 5; display: flex; flex-direction: column; gap: 12px; }
.search-bar {
  display: flex; align-items: center; gap: 16px; height: 56px; padding: 0 16px;
  border-radius: 28px; background: var(--md-surface-container-high); cursor: text;
}
.search-bar:focus-within { box-shadow: 0 0 0 2px var(--md-primary); }
.search-bar svg { width: 24px; height: 24px; flex: none; color: var(--md-on-surface-variant); }
.search-bar input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; font-size: 16px; letter-spacing: 0.5px; }
.search-bar input::placeholder { color: var(--md-on-surface-variant); }
.search-bar input::-webkit-search-cancel-button { filter: grayscale(1); }

.chip-set { display: flex; flex-wrap: wrap; gap: 8px; }
.filter-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.copy-anchor { margin-left: auto; }
.menu button:disabled { color: var(--md-on-surface); opacity: 0.38; cursor: default; }

/* Manual copy dialog (M3 basic dialog) */
.manual-copy {
  width: min(560px, calc(100vw - 32px)); padding: 24px; border: 0; border-radius: 28px;
  background: var(--md-surface-container-high); color: var(--md-on-surface); box-shadow: var(--elev-3);
}
.manual-copy::backdrop { background: rgba(0, 0, 0, 0.32); }
.manual-copy h3 { margin: 0 0 8px; font-size: 24px; line-height: 32px; font-weight: 400; }
.manual-copy .subtitle { margin: 0 0 16px; }
.manual-copy-text {
  width: 100%; resize: vertical; padding: 12px; border: 1px solid var(--md-outline); border-radius: 4px;
  background: var(--md-surface); color: var(--md-on-surface); font: 13px/1.5 var(--mono);
}
.dialog-actions { display: flex; justify-content: flex-end; margin-top: 20px; }
.filter-chip {
  display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 16px;
  border: 1px solid var(--md-outline); border-radius: 8px;
  background: transparent; color: var(--md-on-surface-variant);
  font-size: 14px; font-weight: 500; letter-spacing: 0.1px;
}
.filter-chip .chip-check { display: none; width: 18px; height: 18px; }
.filter-chip[aria-checked="true"] { padding-left: 8px; border-color: transparent; background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
.filter-chip[aria-checked="true"] .chip-check { display: block; color: var(--md-primary); }

/* Lists */
.result-section { display: flex; flex-direction: column; gap: 8px; }
.section-header {
  display: flex; align-items: center; gap: 8px; padding: 8px 16px 0;
  font-size: 14px; font-weight: 500; line-height: 20px; letter-spacing: 0.1px; color: var(--md-primary);  /* title-small */
}
.section-count {
  display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px;
  border-radius: 10px; background: var(--md-primary-container); color: var(--md-on-primary-container);
  font-size: 11px; font-weight: 500;
}
.list { overflow: hidden; padding: 8px 0; }
.row + .row { border-top: 1px solid var(--md-outline-variant); }
.row > summary {
  display: grid; grid-template-columns: 40px minmax(0, 1fr) auto 24px; align-items: center; gap: 16px;
  min-height: 72px; padding: 8px 16px;
  list-style: none; cursor: pointer;
}
.row > summary::-webkit-details-marker { display: none; }
.avatar {
  display: grid; place-items: center; width: 40px; height: 40px;
  border-radius: 50%; background: var(--cc); color: var(--con);
}
.avatar svg { width: 24px; height: 24px; }
.row-text { min-width: 0; }
.row-name { font-size: 16px; line-height: 24px; letter-spacing: 0.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-value { font: 13px/20px var(--mono); letter-spacing: 0; color: var(--md-on-surface-variant); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-value.absent { font-family: var(--font); font-size: 14px; letter-spacing: 0.25px; font-style: italic; }
.row-chevron { width: 24px; height: 24px; color: var(--md-on-surface-variant); transition: transform 0.2s var(--ease); }
.row[open] > summary .row-chevron { transform: rotate(180deg); }

/* Severity chips */
.badge {
  display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px;
  border: 1px solid transparent; border-radius: 8px;
  background: var(--cc); color: var(--con);
  font-size: 12px; font-weight: 500; line-height: 16px; letter-spacing: 0.5px; white-space: nowrap;
}
.badge.contingent { background: transparent; border-color: var(--c); color: var(--c); }
.badge-icon { width: 14px; height: 14px; }
.row-badges { display: inline-flex; align-items: center; gap: 6px; }
.to-confirm-marker { --c: var(--md-on-surface-variant); padding: 0 6px; gap: 2px; }

.row-detail { display: flex; flex-direction: column; gap: 16px; padding: 4px 24px 24px 72px; }
.value-block {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 8px 8px 16px; border-radius: 8px; background: var(--md-surface-container-highest);
}
.value-block code { flex: 1; min-width: 0; padding: 6px 0; font-size: 13px; line-height: 20px; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
.value-block.absent { padding: 14px 16px; color: var(--md-on-surface-variant); font-style: italic; }

.finding { display: flex; flex-direction: column; gap: 8px; }
.finding + .finding { padding-top: 16px; border-top: 1px solid var(--md-outline-variant); }
.finding-head { display: flex; align-items: flex-start; gap: 12px; }
.finding-head .badge { flex: none; }
.finding.note .finding-title { font-weight: 400; }
.note-icon { width: 20px; height: 20px; flex: none; color: var(--md-on-surface-variant); margin-top: 2px; }
.finding-title { font-size: 16px; font-weight: 500; line-height: 24px; letter-spacing: 0.15px; overflow-wrap: anywhere; }   /* title-medium */
.finding-desc { font-size: 14px; line-height: 20px; color: var(--md-on-surface-variant); overflow-wrap: anywhere; }
.callout {
  display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 12px;
  padding: 12px 16px; border-radius: 12px; overflow-wrap: anywhere;
}
.callout > svg { width: 20px; height: 20px; margin-top: 2px; }
.callout-label { display: block; margin-bottom: 2px; font-size: 12px; font-weight: 500; line-height: 16px; letter-spacing: 0.5px; }
.callout.verify { background: var(--md-tertiary-container); color: var(--md-on-tertiary-container); }
.callout.rec { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }

.sources { font-size: 13px; line-height: 18px; color: var(--md-on-surface-variant); }
.sources > summary {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px 4px 4px; margin-left: -4px;
  border-radius: 8px; cursor: pointer; list-style: none; font-weight: 500; letter-spacing: 0.1px;
}
.sources > summary::-webkit-details-marker { display: none; }
.sources > summary:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }
.sources > summary .chev { width: 18px; height: 18px; transition: transform 150ms; }
.sources[open] > summary .chev { transform: rotate(180deg); }
.sources ol { display: flex; flex-direction: column; gap: 10px; margin: 8px 0 0; padding-left: 24px; }
.source-link {
  display: inline-flex; align-items: center; gap: 4px; color: var(--md-primary);
  font-weight: 500; text-decoration: none; overflow-wrap: anywhere;
}
.source-link:hover { text-decoration: underline; }
.source-link:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; border-radius: 2px; }
.source-open { width: 14px; height: 14px; flex: none; }
.source-quote { display: block; margin-top: 2px; font-style: italic; overflow-wrap: anywhere; }

.no-match { padding: 24px; text-align: center; color: var(--md-on-surface-variant); }

/* ---------------------------------------------------------------- Snackbar */

.toast {
  position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 50;
  transform: translateX(-50%);
  min-width: 288px; max-width: min(560px, calc(100vw - 32px));
  padding: 14px 16px; border-radius: 4px;
  background: var(--md-inverse-surface); color: var(--md-inverse-on-surface);
  font-size: 14px; line-height: 20px;
  box-shadow: var(--elev-3);
  animation: snack-in 0.25s var(--ease);
}
@keyframes snack-in { from { opacity: 0; transform: translate(-50%, 16px); } }

/* ------------------------------------------------------------- Responsive */

/* The bar's two selectors move to their own row before they crowd the title
   (the Italian labels are the longest). */
@media (max-width: 959px) {
  .top-app-bar { flex-wrap: wrap; row-gap: 4px; padding-bottom: 12px; }
  .top-app-bar > .segmented { order: 3; width: 100%; }
  .top-app-bar > .segmented button { flex: 1; min-width: 0; }
}

/* M3 compact / medium window classes */
@media (max-width: 839px) {
  .layout { grid-template-columns: minmax(0, 1fr); padding: 8px 16px 32px; gap: 16px; }
  .input-pane { position: static; }
  #input { height: 240px; }
  .row > summary { grid-template-columns: 40px minmax(0, 1fr) 24px; }
  .row > summary .row-badges { grid-column: 2; grid-row: 2; justify-self: start; }
  .row > summary .row-chevron { grid-column: 3; grid-row: 1 / span 2; }
  .row-detail { padding: 4px 16px 20px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

@media print {
  .top-app-bar, .input-pane, .filter-bar, .skip-link, .toast { display: none !important; }
  .layout { display: block; padding: 0; }
  .row-detail { display: flex !important; }
}

/* Decision on a finding to confirm */
.filter-chip[aria-pressed="true"] { padding-left: 8px; border-color: transparent; background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
.filter-chip[aria-pressed="true"] .chip-check { display: block; color: var(--md-primary); }
.finding.decided-excluded :is(.finding-head, .finding-desc, .callout) { opacity: 0.6; }
.finding.decided-excluded .finding-title { text-decoration: line-through; }

/* A check: the question, then the two outcomes */
.check-question { margin: 0; }
.check-outcomes { display: grid; gap: 2px; margin: 6px 0 0; padding: 0; list-style: none; }
.check-outcomes li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 6px; align-items: start; }
.check-outcomes svg { width: 16px; height: 16px; margin-top: 2px; }
.check-outcomes strong { font-weight: 500; }

/* Language switch: a compact segmented pair, the active language highlighted */
.segmented.lang-switch { height: 32px; margin: 0 4px 0 8px; }
.segmented.lang-switch button { min-width: 0; padding: 0 10px; font-size: 13px; letter-spacing: 0.5px; }
.segmented.lang-switch button:first-child { border-radius: 16px 0 0 16px; }
.segmented.lang-switch button:last-child { border-radius: 0 16px 16px 0; }

/* Phone width: logo, title, samples, EN|IT and theme stay on one row */
@media (max-width: 599px) {
  .top-app-bar { column-gap: 8px; }
  .app-bar-title { gap: 8px; }
  .app-bar-title h1 { font-size: 20px; }
  .segmented.lang-switch { margin: 0 0 0 4px; }
  .segmented.lang-switch button { padding: 0 7px; }
}

/* src/core/i18n.js */
/*
 * Header Analyzer: languages.
 *
 * Every module that writes text a person reads (the parser's notes, the CSP
 * and header rules, the correlations, the findings list) is a body run with
 * L(english, italian), which returns the string for its language. The body
 * runs once in English straight away, so HL.rules, HL.csp and the rest are
 * the English modules; localized(lang) runs the same bodies again on a copy
 * of the namespace for another language. Rules and grades are the same code
 * in every language: only the strings differ.
 */
(function (HL) {

  const LANGS = Object.freeze(['en', 'it']);
  const DEFAULT_LANG = 'en';
  const bodies = [];
  const instances = new Map();

  /** Register a module body, and run it now in English on HL itself. */
  function module(body) {
    bodies.push(body);
    body(HL, pick(DEFAULT_LANG));
  }

  /** The namespace in `lang`: HL itself for English, a localized copy otherwise. */
  function localized(lang) {
    if (!LANGS.includes(lang) || lang === DEFAULT_LANG) return HL;
    if (!instances.has(lang)) {
      const ns = Object.create(HL);
      for (const body of bodies) body(ns, pick(lang));
      instances.set(lang, ns);

        brief: L(`Inline styles allowed and ${leak.split(' ')[0]} reaches any origin`, `Stili inline consentiti e ${leak.split(' ')[0]} raggiunge qualsiasi origine`),
        description: L(`Any inline style block or style attribute is applied, so an HTML injection can run CSS even where script is blocked. Attribute selectors read values out of the page character by character (CSRF tokens, prefilled form fields, hidden inputs), and each match loads a background image or a font from the attacker's server, which ${leak} allows. The injection becomes theft of those values without a line of script.`, `Qualsiasi blocco di stile inline o attributo style viene applicato, quindi un'iniezione HTML può eseguire CSS anche dove gli script sono bloccati. I selettori di attributo leggono i valori della pagina un carattere alla volta (token CSRF, campi precompilati, input nascosti), e ogni corrispondenza carica un'immagine di sfondo o un font dal server dell'attaccante, cosa che ${leak} consente. L'iniezione diventa furto di quei valori senza una riga di script.`),
        recommendation: L(`Allow inline styles with a nonce or a hash, or move them into stylesheets. Restricting ${leak.split(' ')[0]} (default-src 'self' does it) closes the channel even before that.`, `Consentire gli stili inline con un nonce o un hash, oppure spostarli in fogli di stile. Restringere ${leak.split(' ')[0]} (lo fa default-src 'self') chiude il canale già prima.`),
      });
    } else {
      out.add(Severity.LOW, L(`${lbl}: 'unsafe-inline'`, `${lbl}: 'unsafe-inline'`), {
        brief: L(`'unsafe-inline' allowed for styles in ${eff.name}`, `'unsafe-inline' consentito per gli stili in ${eff.name}`),
        description: L('Any inline style block or style attribute is applied, so an HTML injection can restyle the page: hiding content or overlaying a fake message on the real site. Reading values out of the page with CSS would need a background image or a font from another origin, and this policy\'s img-src and font-src do not allow one.', "Qualsiasi blocco di stile inline o attributo style viene applicato, quindi un'iniezione HTML può modificare l'aspetto della pagina: nascondere contenuti o sovrapporre un messaggio falso al sito vero. Leggere valori della pagina con il CSS richiederebbe un'immagine di sfondo o un font da un'altra origine, e img-src e font-src di questa policy non lo consentono."),
        sources: ['zap-10055-6', 'obs-csp-style', 'ps-css-attr', 'csp3-exfil'],
        recommendation: L('Allow inline styles with a nonce or a hash, or move them into stylesheets.', "Consentire gli stili inline con un nonce o un hash, oppure spostarli in fogli di stile."),
      });
    }
  }

  function checkScriptElements(lbl, eff, upgrades, out) {
    const st = inlineState(eff.lower);
    checkInline(lbl, eff, 'script', out);

    if (st.strictDynamic && !st.hasNonce && !st.hasHash) {
      out.add(Severity.OK, L(`${lbl}: 'strict-dynamic' without a nonce or hash blocks every script`, `${lbl}: 'strict-dynamic' senza nonce né hash blocca ogni script`), {
        sources: ['csp3-sd-ignores'],
        status: Status.NONE,
        description: L("'strict-dynamic' switches off the allowlist and 'unsafe-inline', and trusts only scripts already trusted through a nonce or a hash. With neither, no script can run. That is not a weakness, but it is probably not what was meant.", "'strict-dynamic' disattiva l'allowlist e 'unsafe-inline', e si fida solo degli script già autorizzati tramite un nonce o un hash. Senza nessuno dei due, nessuno script può essere eseguito. Non è una debolezza, ma probabilmente non è ciò che si intendeva."),
        recommendation: L("Add a per-response 'nonce-…' (or the hashes of the inline scripts) to the same list.", "Aggiungere allo stesso elenco un 'nonce-…' per risposta (o gli hash degli script inline)."),
      });
    }

    if (eff.lower.includes("'unsafe-hashes'")) {
      if (st.hasHash) {
        out.add(Severity.LOW, L(`${lbl}: 'unsafe-hashes'`, `${lbl}: 'unsafe-hashes'`), {
          sources: ['csp3-unsafe-hashes', 'zap-10055-7'],
          brief: L(`'unsafe-hashes' allowed in ${eff.name}`, `'unsafe-hashes' consentito in ${eff.name}`),
          description: L("Lets event-handler attributes and javascript: URLs run when their text matches a hash. An attacker who can inject markup can reuse any allowed handler on an element of their choosing.", "Permette l'esecuzione degli attributi event handler e degli URL javascript: quando il loro testo corrisponde a un hash. Un attaccante che può iniettare markup può riusare qualsiasi handler consentito su un elemento a sua scelta."),
          recommendation: L('Replace inline event handlers with addEventListener, then remove it.', "Sostituire gli event handler inline con addEventListener, poi rimuoverlo."),
        });
      } else {
        out.add(Severity.OK, L(`${lbl}: 'unsafe-hashes' has no effect without a hash`, `${lbl}: 'unsafe-hashes' non ha effetto senza un hash`), {
          sources: ['csp3-unsafe-hashes'],
          status: Status.NONE,
          description: L("'unsafe-hashes' only widens what hashes match; with no hash in the list it allows nothing.", "'unsafe-hashes' allarga solo ciò che gli hash riconoscono; senza un hash nell'elenco non consente nulla."),
          recommendation: L("Remove 'unsafe-hashes'.", "Rimuovere 'unsafe-hashes'."),
        });
      }
    }

    for (const t of eff.lower) {
      const m = NONCE.exec(t);
      if (m && m[1].replace(/=+$/, '').length < 22) {
        out.add(Severity.LOW, L(`${lbl}: nonce is shorter than 128 bits`, `${lbl}: il nonce è più corto di 128 bit`), {
          sources: ['csp3-nonce-128'],
          brief: L('Nonce shorter than 128 bits', "Nonce più corto di 128 bit"),
          description: L(`The nonce '${m[1]}' has ${m[1].replace(/=+$/, '').length} characters. CSP3 asks for at least 128 bits of cryptographically random data, which is 22 base64 characters; a short one can be guessed.`, `Il nonce '${m[1]}' ha ${m[1].replace(/=+$/, '').length} caratteri. CSP3 chiede almeno 128 bit di dati casuali crittograficamente sicuri, cioè 22 caratteri base64; uno corto può essere indovinato.`),
          recommendation: L('Generate at least 16 random bytes per response and base64-encode them.', "Generare almeno 16 byte casuali per risposta e codificarli in base64."),
        });
      }
    }
    if (st.hasNonce) {
      out.add(Severity.OK, L(`${lbl}: the nonce must change on every response`, `${lbl}: il nonce deve cambiare a ogni risposta`), {
        sources: ['csp3-nonce-unique'],
        status: Status.NONE,
        description: L('A nonce works only if an attacker cannot know it in advance. One that is fixed, cached with the page, or reused across responses can be copied straight into an injected <script nonce=…>, and the policy then allows the injection: no better than \'unsafe-inline\'. One saved response cannot show which it is.', "Un nonce funziona solo se un attaccante non può conoscerlo in anticipo. Uno fisso, salvato in cache con la pagina o riusato tra le risposte può essere copiato direttamente in un <script nonce=…> iniettato, e la policy allora consente l'iniezione: non meglio di 'unsafe-inline'. Una sola risposta salvata non può mostrare quale sia il caso."),
        ...check(L('Request the same URL twice (with any cache bypassed) and compare the nonce values.', "Richiedere lo stesso URL due volte (aggirando qualsiasi cache) e confrontare i valori del nonce."), L('they are the same', "sono uguali"), L('they differ', "sono diversi")),
      });
    }

    if (st.strictDynamic && (st.hasNonce || st.hasHash)) {
      const ignored = eff.tokens.filter((t, k) => {
        const l = eff.lower[k];
        return l === "'self'" || l === '*' || SCHEME_SOURCE.test(l) || isHostSource(l);
      });
      if (ignored.length) {
        out.add(Severity.OK, L(`${lbl}: allowlist entries are ignored under 'strict-dynamic'`, `${lbl}: le voci dell'allowlist vengono ignorate con 'strict-dynamic'`), {
          sources: ['csp3-sd-ignores', 'strictcsp-https'],
          status: Status.NONE,
          description: L(`With 'strict-dynamic' and a ${st.hasNonce ? 'nonce' : 'hash'}, browsers that support CSP3 ignore ${ignored.join(' ')}: only scripts trusted through the ${st.hasNonce ? 'nonce' : 'hash'}, and the scripts those load, can run. The entries only matter to older browsers, which is how Google's recommended strict policy keeps them working.`, `Con 'strict-dynamic' e un ${st.hasNonce ? 'nonce' : 'hash'}, i browser che supportano CSP3 ignorano ${ignored.join(' ')}: possono essere eseguiti solo gli script autorizzati tramite il ${st.hasNonce ? 'nonce' : 'hash'}, e gli script che questi caricano. Le voci contano solo per i browser più vecchi, ed è così che la strict policy raccomandata da Google li mantiene funzionanti.`),
        });
      }
      return;
    }

    for (let k = 0; k < eff.lower.length; k++) {
      const t = eff.lower[k];
      const raw = eff.tokens[k];
      if (t === '*' || t === 'http:') {
        out.add(Severity.MEDIUM, L(`${lbl}: overly broad source '${raw}'`, `${lbl}: sorgente troppo ampia '${raw}'`), {
          sources: ['cspe-wildcard', 'cspe-schemes', 'zap-10055-4'],
          brief: L(`Scripts allowed from ${raw}`, `Script consentiti da ${raw}`),
          description: L(`'${raw}' allows scripts from any ${t === '*' ? 'web' : 'plain-HTTP'} origin, including one the attacker owns, so an HTML injection can load arbitrary script.`, `'${raw}' consente script da qualsiasi origine ${t === '*' ? 'web' : 'in HTTP in chiaro'}, inclusa una dell'attaccante, quindi un'iniezione HTML può caricare script arbitrari.`),
          recommendation: L("Replace it with a nonce and 'strict-dynamic', or with the exact origins scripts come from.", "Sostituirla con un nonce e 'strict-dynamic', oppure con le origini esatte da cui provengono gli script."),
        });
      } else if (t === 'https:') {
        out.add(Severity.MEDIUM, L(`${lbl}: overly broad source 'https:'`, `${lbl}: sorgente troppo ampia 'https:'`), {
          sources: ['cspe-schemes'],
          brief: L('Scripts allowed from any HTTPS origin', "Script consentiti da qualsiasi origine HTTPS"),
          description: L("'https:' allows scripts from every HTTPS origin, including one the attacker registers for a few euros.", "'https:' consente script da ogni origine HTTPS, inclusa una che l'attaccante registra con pochi euro."),
          recommendation: L("Replace it with a nonce and 'strict-dynamic', or with the exact origins scripts come from.", "Sostituirla con un nonce e 'strict-dynamic', oppure con le origini esatte da cui provengono gli script."),
        });
      } else if (t === 'data:') {
        out.add(Severity.MEDIUM, L(`${lbl}: 'data:' URI scheme`, `${lbl}: schema URI 'data:'`), {
          sources: ['cspe-schemes'],
          brief: L('Scripts allowed from data: URIs', "Script consentiti da URI data:"),
          description: L("An injected <script src=\"data:text/javascript,…\"> carries its own code, so 'data:' is as good as 'unsafe-inline' to an attacker.", "Uno <script src=\"data:text/javascript,…\"> iniettato porta con sé il proprio codice, quindi per un attaccante 'data:' equivale a 'unsafe-inline'."),
          recommendation: L("Remove 'data:'.", "Rimuovere 'data:'."),
        });
      } else if (t === 'blob:' || t === 'filesystem:') {
        out.add(Severity.LOW, L(`${lbl}: '${t}' URI scheme`, `${lbl}: schema URI '${t}'`), {
          sources: ['csp3-schemes'],
          brief: L(`Scripts allowed from ${t} URIs`, `Script consentiti da URI ${t}`),
          description: L(`Script that can create a ${t.slice(0, -1)} URL, or an injection that can reach code that does, can run arbitrary code through it.`, `Uno script che può creare un URL ${t.slice(0, -1)}, o un'iniezione che può raggiungere codice che lo fa, può eseguire codice arbitrario attraverso di esso.`),
          recommendation: L(`Remove '${t}' unless the application really loads scripts from it.`, `Rimuovere '${t}' a meno che l'applicazione non carichi davvero script da lì.`),
        });
      } else if (isHostSource(t)) {
        checkHost(lbl, raw, t, upgrades, out);
      }
    }
  }

  function checkHost(lbl, raw, t, upgrades, out) {
    const { host, wildcard } = hostOf(t);
    if (wildcard && (!host.includes('.') || MULTI_LABEL_SUFFIXES.has(host))) {
      out.add(Severity.MEDIUM, L(`${lbl}: wildcard over a whole top-level domain '${raw}'`, `${lbl}: wildcard su un intero dominio di primo livello '${raw}'`), {
        sources: ['csp3-wildcard'],
        brief: L(`Scripts allowed from ${raw}`, `Script consentiti da ${raw}`),
        description: L(`'${raw}' allows scripts from every domain under .${host}, including any the attacker registers.`, `'${raw}' consente script da ogni dominio sotto .${host}, inclusi quelli che l'attaccante registra.`),
        recommendation: L(`Replace '${raw}' with the specific hosts scripts come from.`, `Sostituire '${raw}' con gli host specifici da cui provengono gli script.`),
      });
      return;
    }
    if (wildcard && BYPASS_BASES.has(host)) {
      out.add(Severity.MEDIUM, L(`${lbl}: known CSP bypass via wildcard '${raw}'`, `${lbl}: bypass CSP noto tramite wildcard '${raw}'`), {
        sources: ['cspe-bypass', 'csp3-wildcard'],
        brief: L(`Scripts allowed from bypassable hosts ${raw}`, `Script consentiti da host aggirabili ${raw}`),
        description: L(`'${raw}' covers subdomains of ${host} that host JSONP endpoints or old AngularJS builds, either of which runs attacker-chosen code under this policy.`, `'${raw}' copre sottodomini di ${host} che ospitano endpoint JSONP o vecchie versioni di AngularJS, e ognuno dei due esegue codice scelto dall'attaccante con questa policy.`),
        recommendation: L("Use a nonce with 'strict-dynamic' instead of allowlisting CDNs.", "Usare un nonce con 'strict-dynamic' invece di autorizzare le CDN."),
      });
    } else if (wildcard && USER_CONTENT_BASES.has(host)) {
      out.add(Severity.MEDIUM, L(`${lbl}: wildcard over a domain anyone can publish on '${raw}'`, `${lbl}: wildcard su un dominio su cui chiunque può pubblicare '${raw}'`), {
        sources: ['csp3-wildcard'],
        brief: L(`Scripts allowed from user-content hosts ${raw}`, `Script consentiti da host di contenuti degli utenti ${raw}`),
        description: L(`Anyone can create a site under ${host}, so '${raw}' lets an attacker host a script there and load it through an HTML injection.`, `Chiunque può creare un sito sotto ${host}, quindi '${raw}' permette a un attaccante di ospitarvi uno script e caricarlo tramite un'iniezione HTML.`),
        recommendation: L(`Name the exact subdomain of ${host} that serves your scripts.`, `Indicare il sottodominio esatto di ${host} che serve i vostri script.`),
      });
    } else if (!wildcard && BYPASS_HOSTS.has(host)) {
      out.add(Severity.MEDIUM, L(`${lbl}: known CSP bypass host '${host}'`, `${lbl}: host noto per aggirare la CSP '${host}'`), {
        sources: ['cspe-bypass'],
        brief: L(`Scripts allowed from bypassable host ${host}`, `Script consentiti dall'host aggirabile ${host}`),
        description: L(`${host} serves attacker-chosen code: a JSONP endpoint that runs any callback, or any version of any library (old AngularJS evaluates template expressions). Allowlisting it therefore lets an HTML injection run arbitrary script.`, `${host} serve codice scelto dall'attaccante: un endpoint JSONP che esegue qualsiasi callback, oppure qualsiasi versione di qualsiasi libreria (il vecchio AngularJS valuta le espressioni nei template). Autorizzarlo permette quindi a un'iniezione HTML di eseguire script arbitrari.`),
        recommendation: L("Remove the host and allow its scripts with a nonce and 'strict-dynamic' instead.", "Rimuovere l'host e consentire i suoi script con un nonce e 'strict-dynamic'."),
      });
    }
    if (t.startsWith('http://') && !upgrades) {
      out.add(Severity.LOW, L(`${lbl}: scripts allowed over plain HTTP from '${raw}'`, `${lbl}: script consentiti in HTTP in chiaro da '${raw}'`), {
        sources: ['mixed-script', 'cspe-http'],
        brief: L(`Scripts allowed over plain HTTP from ${raw}`, `Script consentiti in HTTP in chiaro da ${raw}`),
        description: L('On a page served over HTTPS, browsers block a plain-HTTP script as mixed content, so this source only fails to load. On a page served over plain HTTP the script can be replaced by anyone on the network path, and it runs with this page\'s privileges.', "Su una pagina servita in HTTPS, i browser bloccano uno script in HTTP in chiaro come contenuto misto, quindi questa sorgente semplicemente non si carica. Su una pagina servita in HTTP in chiaro lo script può essere sostituito da chiunque sia sul percorso di rete, e viene eseguito con i privilegi di questa pagina."),
        recommendation: L(`Use https:// for '${raw}', or add upgrade-insecure-requests.`, `Usare https:// per '${raw}', oppure aggiungere upgrade-insecure-requests.`),
      });
    }
  }

  function checkStyles(policy, out) {
    const elem = effective(policy, 'style-src-elem');
    const attr = effective(policy, 'style-src-attr');
    const leak = exfiltrationChannel(policy);
    if (elem) checkInline(label('style-src', elem), elem, 'style', out, leak);
    if (attr) checkInline(label('style-src', attr), attr, 'style', out, leak);
  }

  /**
   * The directive through which injected CSS can send what it reads to any
   * origin (a background image or a font), or null when both are restricted.
   * Missing, with no default-src to fall back on, counts as open.
   */
  function exfiltrationChannel(policy) {
    for (const name of ['img-src', 'font-src']) {
      const eff = effective(policy, name);
      if (!eff) return L(`${name} (not set, and no default-src)`, `${name} (non impostata, e nessun default-src)`);
      if (eff.lower.some(permissiveAncestor)) return eff.name === name ? name : L(`${name} (from ${eff.name})`, `${name} (da ${eff.name})`);
    }
    return null;
  }

  const BROAD = new Set(['*', 'http:', 'https:']);

  function checkOthers(policy, out) {
    const object = effective(policy, 'object-src');
    if (!object) {
      out.add(Severity.LOW, L('Missing object-src directive', "Direttiva object-src mancante"), {
        sources: ['cspe-object', 'asvs-3.4.3', 'bp-csp'],
        brief: L('object-src is not set', "object-src non è impostata"),
        description: L('With neither object-src nor default-src, <object> and <embed> can load content from anywhere, historically the easiest way around a CSP.', "Senza object-src né default-src, <object> e <embed> possono caricare contenuti da qualsiasi origine: storicamente il modo più facile per aggirare una CSP."),
        recommendation: L("Add object-src 'none'.", "Aggiungere object-src 'none'."),
      }, true);
    } else if (object.lower.length > 0 && !(object.lower.length === 1 && object.lower[0] === "'none'")) {
      out.add(Severity.LOW, L(`Permissive object-src${object.name === 'object-src' ? '' : ' (from default-src)'}`, `object-src permissiva${object.name === 'object-src' ? '' : ' (da default-src)'}`), {
        sources: ['asvs-3.4.3', 'bp-csp'],
        brief: L(`object-src is not 'none'`, `object-src non è 'none'`),
        description: L("Anything other than 'none' lets <object> and <embed> load content, and the content they load has been used to bypass CSP. No modern application needs plugins.", "Qualsiasi valore diverso da 'none' permette a <object> e <embed> di caricare contenuti, e quei contenuti sono stati usati per aggirare la CSP. Nessuna applicazione moderna ha bisogno di plugin."),
        recommendation: L("Set object-src 'none'.", "Impostare object-src 'none'."),
      });
    }

    const base = policy.directives.get('base-uri');
    if (!base) {
      out.add(baseCanRedirectTrusted(policy) ? Severity.MEDIUM : Severity.LOW, L('Missing base-uri directive', "Direttiva base-uri mancante"), {
        sources: ['csp3-base', 'cspe-base-uri', 'asvs-3.4.3'],
        brief: L('base-uri is not set', "base-uri non è impostata"),
        description: L('base-uri does not fall back to default-src. Without it an injected <base href> redirects every relative script URL on the page to the attacker\'s server, which defeats a nonce-based policy, since the nonced <script> tag itself is legitimate.', "base-uri non ricade su default-src. Senza di essa un <base href> iniettato reindirizza ogni URL relativo degli script della pagina verso il server dell'attaccante, e questo vanifica una policy basata su nonce, perché il tag <script> con il nonce è legittimo."),
        recommendation: L("Add base-uri 'none' (or 'self' if the page uses <base>).", "Aggiungere base-uri 'none' (o 'self' se la pagina usa <base>)."),
      }, true);
    } else if (base.lower.some((t) => BROAD.has(t) || t === 'data:')) {
      out.add(Severity.MEDIUM, L('Permissive base-uri', "base-uri permissiva"), {
        sources: ['csp3-base', 'asvs-3.4.3'],
        brief: L('base-uri allows any URL', "base-uri consente qualsiasi URL"),
        description: L('base-uri allows any URL as the document base, so an injected <base href> can point relative script URLs at the attacker\'s server.', "base-uri consente qualsiasi URL come base del documento, quindi un <base href> iniettato può puntare gli URL relativi degli script verso il server dell'attaccante."),
        recommendation: L("Set base-uri 'none' or 'self'.", "Impostare base-uri 'none' o 'self'."),
      });
    }

    const ancestors = policy.directives.get('frame-ancestors');
    if (!ancestors) {
      out.add(Severity.LOW, L('Missing frame-ancestors directive', "Direttiva frame-ancestors mancante"), {
        sources: ['asvs-3.4.6', 'csp3-fa-nofallback', 'zap-10055-13'],
        brief: L('frame-ancestors is not set', "frame-ancestors non è impostata"),
        description: L('frame-ancestors is the standard control for who may frame this page, and it takes precedence over X-Frame-Options in every browser that implements it. Without it, framing is decided by X-Frame-Options alone.', "frame-ancestors è il controllo standard su chi può incorniciare questa pagina, e prevale su X-Frame-Options in ogni browser che lo implementa. Senza di essa, il framing è deciso solo da X-Frame-Options."),
        recommendation: L("Add frame-ancestors 'none' (or 'self').", "Aggiungere frame-ancestors 'none' (o 'self')."),
      }, true);
    } else if (ancestors.lower.some(permissiveAncestor)) {
      out.add(Severity.MEDIUM, PERMISSIVE_FRAME_ANCESTORS, {
        sources: ['asvs-3.4.6', 'cs-xfo-fa'],
        brief: L('frame-ancestors allows any site', "frame-ancestors consente qualsiasi sito"),
        description: L('frame-ancestors allows any site to embed this page, so an attacker can frame it invisibly and trick the user into clicking it (clickjacking).', "frame-ancestors consente a qualsiasi sito di incorporare questa pagina, quindi un attaccante può incorniciarla in modo invisibile e indurre l'utente a cliccarci (clickjacking)."),
        recommendation: L("Set frame-ancestors 'none', 'self', or the exact origins that need to embed the page.", "Impostare frame-ancestors 'none', 'self', o le origini esatte che devono incorporare la pagina."),
      });
    }

    const def = policy.directives.get('default-src');
    if (!def) {
      out.add(Severity.LOW, L('Missing default-src directive', "Direttiva default-src mancante"), {
        sources: ['csp3-default', 'csp3-exfil', 'bp-csp'],
        brief: L('default-src is not set', "default-src non è impostata"),
        description: L('Resource types without a directive of their own are unrestricted when default-src is absent: fonts, media, connections, frames and so on.', "Senza default-src, i tipi di risorsa che non hanno una direttiva propria non sono ristretti: font, media, connessioni, frame e così via."),
        recommendation: L("Add default-src 'none' (or 'self') as a baseline, then allow what each type needs.", "Aggiungere default-src 'none' (o 'self') come base, poi consentire ciò che serve a ogni tipo."),
      }, true);
    } else if (def.lower.includes('*') || def.lower.includes('http:')) {
      out.add(Severity.LOW, L('Permissive default-src', "default-src permissiva"), {
        sources: ['csp3-default', 'bp-csp'],
        brief: L('default-src allows any origin', "default-src consente qualsiasi origine"),
        description: L('default-src applies to every resource type without its own directive, and this one allows any origin.', "default-src si applica a ogni tipo di risorsa senza una direttiva propria, e questa consente qualsiasi origine."),
        recommendation: L("Use default-src 'none' or 'self' and add per-type directives.", "Usare default-src 'none' o 'self' e aggiungere direttive per tipo."),
      });
    } else if (def.lower.includes('https:')) {
      out.add(Severity.LOW, L("Permissive default-src 'https:'", "default-src permissiva 'https:'"), {
        sources: ['csp3-default', 'bp-csp'],
        brief: L('default-src allows any HTTPS origin', "default-src consente qualsiasi origine HTTPS"),
        description: L("default-src applies to every resource type without its own directive, and 'https:' allows every HTTPS origin, including one the attacker owns.", "default-src si applica a ogni tipo di risorsa senza una direttiva propria, e 'https:' consente ogni origine HTTPS, inclusa una dell'attaccante."),
        recommendation: L("Use default-src 'none' or 'self' and add per-type directives.", "Usare default-src 'none' o 'self' e aggiungere direttive per tipo."),
      });
    }

    const form = policy.directives.get('form-action');

        recommendation: L('Add includeSubDomains, once every host under the domain is served over HTTPS.', "Aggiungere includeSubDomains, quando ogni host sotto il dominio è servito in HTTPS."),
      }));
    }
    // Both branches are contingent on the same lookup: the token declares
    // intent, and membership of the list is a separate step.
    if (cfg.requirePreload) {
      // The list entry is for the base domain and covers its subdomains, so a
      // subdomain's own header need not carry the token.
      const token = directives.has('preload');
      findings.push(finding(HSTS, Severity.LOW, L('HSTS: preload list membership not verified', "HSTS: presenza nella lista di preload non verificata"), {
        sources: token ? ['hstspreload-token', 'hstspreload-base', 'hstspreload-subdomains']
          : ['cs-hsts-rec', 'hstspreload-token', 'hstspreload-base', 'hstspreload-subdomains'],
        brief: token ? L('preload is declared but list membership is unverified', "preload è dichiarato ma la presenza nella lista non è verificata") : L('preload is not set', "preload non è impostato"),
        description: L('Preloading is what closes the one gap HSTS cannot close on its own: the first request to this domain, made before the browser has ever seen the site, goes out over plain HTTP and can be stripped by anyone on the network path. ', "Il preload è ciò che chiude l'unica falla che HSTS da solo non può chiudere: la prima richiesta a questo dominio, fatta prima che il browser abbia mai visto il sito, parte in HTTP in chiaro e può essere declassata da chiunque sia sul percorso di rete. ")
          + (token
            ? L('The token is what a domain must send to be accepted, not what puts it there: submission at hstspreload.org is a separate step, and it can be refused or reversed. A domain can carry this token for years without ever being listed.', "Il token è ciò che un dominio deve inviare per essere accettato, non ciò che lo inserisce: l'invio su hstspreload.org è un passaggio separato, e può essere rifiutato o annullato. Un dominio può avere questo token per anni senza mai essere in lista.")
            : L('This header does not carry the preload token, which a domain must send to be accepted; a subdomain can still be covered through its base domain\'s entry.', "Questo header non contiene il token preload, che un dominio deve inviare per essere accettato; un sottodominio può comunque essere coperto tramite la voce del suo dominio principale.")),
        ...check(L('Is the domain, or its base domain (example.com for api.example.com), on hstspreload.org?', "Il dominio, o il suo dominio principale (example.com per api.example.com), è su hstspreload.org?"), L('it is not listed', "non è in lista"), L('it is listed', "è in lista")),
      }));
    }
    if (!findings.length) findings.push(finding(HSTS, Severity.OK, L('HSTS correctly configured', "HSTS configurato correttamente"), { sources: ['cs-hsts-rec', 'asvs-3.4.1'] }));
    return findings;
  }

  // ---------------------------------------------------------------------------
  // X-Frame-Options: HTML "check a navigation response's adherence to
  // X-Frame-Options", which works on a set of lowercased values.
  // ---------------------------------------------------------------------------
  const XFO = 'X-Frame-Options';

  function checkXFrameOptions(value, ctx) {
    const values = new Set(splitOutsideQuotes(value, ',', true).map((v) => v.toLowerCase()));
    const usable = ['deny', 'allowall', 'sameorigin'].some((v) => values.has(v));

    if (values.size > 1) {
      if (usable) {
        return [finding(XFO, Severity.LOW, L(`X-Frame-Options: '${value}' blocks framing by contradicting itself`, `X-Frame-Options: '${value}' blocca il framing contraddicendosi`), {
          sources: ['html-xfo-multi'],
          brief: L('Contradictory values; browsers block framing', "Valori contraddittori; i browser bloccano il framing"),
          description: L('More than one value is given, and at least one is usable, so a browser refuses the frame rather than guess which was meant. Framing is prevented, and a contradiction here can only ever be stricter than the values it is made of, but whichever component set the value being ignored is working on a false assumption, and two components writing this header may be writing others.', "Sono indicati più valori, e almeno uno è utilizzabile, quindi il browser rifiuta il frame invece di indovinare quale si intendesse. Il framing è impedito, e una contraddizione qui può solo essere più restrittiva dei valori che la compongono, ma il componente che ha impostato il valore ignorato lavora su un presupposto falso, e due componenti che scrivono questo header potrebbero scriverne anche altri."),
          recommendation: L('Send X-Frame-Options once, with DENY.', "Inviare X-Frame-Options una sola volta, con DENY."),
        })];
      }
      return [finding(XFO, ctx.absentSeverity, L(`X-Frame-Options: '${value}' leaves the page framable by anyone`, `X-Frame-Options: '${value}' lascia la pagina incorniciabile da chiunque`), {
        brief: L('No valid value, so browsers ignore the header', "Nessun valore valido, quindi i browser ignorano l'header"),
        description: L('Several values are given and none of them is one a browser applies, so the header is treated as if it had been omitted.', "Sono indicati più valori e nessuno è tra quelli che un browser applica, quindi l'header viene trattato come se fosse assente."),
        sources: ['html-xfo-several-invalid', 'zap-10020-4'],
        recommendation: L('Set X-Frame-Options: DENY', "Impostare X-Frame-Options: DENY"),
      })];
    }

    const only = [...values][0];
    if (only === 'deny') return [finding(XFO, Severity.OK, L('X-Frame-Options: DENY (optimal)', "X-Frame-Options: DENY (ottimale)"), { sources: ['cs-xfo-rec', 'bp-xfo'] })];
    if (only === 'sameorigin') {
      return [finding(XFO, Severity.LOW, L('X-Frame-Options: SAMEORIGIN lets another page on this origin frame it', "X-Frame-Options: SAMEORIGIN permette a un'altra pagina di questa origine di incorniciarla"), {
        sources: ['html-xfo-sameorigin', 'cs-xfo-rec', 'bp-xfo'],
        brief: L('SAMEORIGIN instead of DENY', "SAMEORIGIN invece di DENY"),
        description: L('A browser walks every containing document and refuses the frame as soon as one is cross-origin, so this is as strong as frame-ancestors \'self\'. What it still permits is a page on this same origin. That matters where an attacker can put markup on one: a stored HTML injection that a CSP stops short of script execution, say: they cannot read anything through it, but they can frame this page and overlay it, which DENY would have prevented outright.', "Il browser controlla ogni documento contenitore e rifiuta il frame appena uno è cross-origin, quindi è forte quanto frame-ancestors 'self'. Ciò che consente ancora è una pagina della stessa origine. Conta dove un attaccante può inserire markup su una di esse, per esempio un'iniezione HTML persistente che una CSP ferma prima dell'esecuzione di script: attraverso di essa non può leggere nulla, ma può incorniciare questa pagina e sovrapporle qualcosa, cosa che DENY avrebbe impedito del tutto."),
        ...check(L('Does another page on this origin need to frame this one (an admin console, a preview pane, an embedded editor)?', "Un'altra pagina di questa origine ha bisogno di incorniciare questa (una console di amministrazione, un riquadro di anteprima, un editor incorporato)?"), L('no', 'no'), L('yes', 'sì')),
      })];
    }
    if (only.startsWith('allow-from')) {
      return [finding(XFO, ctx.absentSeverity, L('X-Frame-Options: ALLOW-FROM leaves the page framable by anyone', "X-Frame-Options: ALLOW-FROM lascia la pagina incorniciabile da chiunque"), {
        sources: ['html-xfo-allowfrom', 'html-xfo-invalid', 'zap-10020-4'],
        status: Status.DEPRECATED, brief: L('ALLOW-FROM is unsupported, so browsers ignore the header', "ALLOW-FROM non è supportato, quindi i browser ignorano l'header"),
        description: L('No current browser implements ALLOW-FROM, and none of them ignore just the directive: they discard the whole header. The page is in the same position as one that never sent it, while the header suggests a policy is in force.', "Nessun browser attuale implementa ALLOW-FROM, e nessuno ignora solo la direttiva: scartano l'intero header. La pagina è nella stessa situazione di una che non lo ha mai inviato, mentre l'header fa pensare che una policy sia attiva."),
        recommendation: L('Set X-Frame-Options: DENY, and name the permitted origins in Content-Security-Policy: frame-ancestors.', "Impostare X-Frame-Options: DENY, e indicare le origini consentite in Content-Security-Policy: frame-ancestors."),
      })];
    }
    return [finding(XFO, ctx.absentSeverity, L(`X-Frame-Options: '${value}' leaves the page framable by anyone`, `X-Frame-Options: '${value}' lascia la pagina incorniciabile da chiunque`), {
      brief: L('Invalid value, so browsers ignore the header', "Valore non valido, quindi i browser ignorano l'header"),
      description: L('A browser applies this header for DENY and SAMEORIGIN and nothing else. Anything else it cannot use, so framing is allowed exactly as if the header were absent.', "Un browser applica questo header per DENY e SAMEORIGIN e nient'altro. Qualsiasi altro valore non lo può usare, quindi il framing è consentito esattamente come se l'header fosse assente."),
      sources: ['html-xfo-invalid', 'zap-10020-4'],
      recommendation: L('Set X-Frame-Options: DENY', "Impostare X-Frame-Options: DENY"),
    })];
  }

  // ---------------------------------------------------------------------------
  // X-Content-Type-Options: Fetch "determine nosniff": values[0] only,
  // ASCII case-insensitive, quotes kept.
  // ---------------------------------------------------------------------------
  function checkXContentTypeOptions(value, ctx) {
    const first = splitOutsideQuotes(value, ',', true)[0];
    if (first.toLowerCase() === 'nosniff') {
      return [finding('X-Content-Type-Options', Severity.OK, L('X-Content-Type-Options: nosniff (correct)', "X-Content-Type-Options: nosniff (corretto)"), { sources: ['fetch-nosniff', 'asvs-3.4.4'] })];
    }
    return [finding('X-Content-Type-Options', ctx.absentSeverity, L(`X-Content-Type-Options: '${first}' leaves MIME sniffing on`, `X-Content-Type-Options: '${first}' lascia attivo il MIME sniffing`), {
      sources: ['fetch-nosniff', 'cs-xcto', 'zap-10021'],
      brief: L('Not set to nosniff', "Non impostato a nosniff"),
      description: L('Only \'nosniff\' switches the protection on, and only as the first value of the header. Anything else leaves the browser free to ignore the declared Content-Type and guess from the bytes, so a file a user uploaded, served as text/plain, can still be read as HTML and run as the site. It also stops blocking a script or stylesheet whose response carries the wrong type.', "Solo 'nosniff' attiva la protezione, e solo come primo valore dell'header. Qualsiasi altro valore lascia il browser libero di ignorare il Content-Type dichiarato e indovinare dai byte, quindi un file caricato da un utente, servito come text/plain, può comunque essere letto come HTML ed eseguito come il sito. Smette anche di bloccare uno script o un foglio di stile la cui risposta ha il tipo sbagliato."),
      recommendation: L('Set X-Content-Type-Options: nosniff', "Impostare X-Content-Type-Options: nosniff"),
    })];
  }

  // ---------------------------------------------------------------------------
  // COOP / COEP: structured field items (HTML §7.1.3.1). The token is compared
  // case-sensitively; a value that fails to parse leaves the policy at
  // unsafe-none.
  // ---------------------------------------------------------------------------
  const COOP = 'Cross-Origin-Opener-Policy';
  const COEP = 'Cross-Origin-Embedder-Policy';

  /** {token} when the value parses to a token item; {invalid: reason} otherwise. */
  function structuredToken(value) {
    const r = parseSfItem(value);
    if (!r.ok) return { invalid: r.reason };
    const bare = r.item[0];
    if (bare.type !== 'token') return { invalid: L(`it is a ${bare.type === 'string' ? 'quoted string' : bare.type}, not a token`, `è una ${bare.type === 'string' ? 'stringa tra virgolette' : bare.type}, non un token`) };
    return { token: bare.value };
  }

  function caseHint(token, valid) {
    const match = valid.find((v) => v === token.toLowerCase());
    return match && match !== token ? L(` Values are case-sensitive: '${match}' would be applied, '${token}' is not.`, ` I valori distinguono maiuscole e minuscole: '${match}' verrebbe applicato, '${token}' no.`) : '';
  }

  function coopNotApplied(ctx, reason, recommendation, extra) {
    return finding(COOP, ctx.absentSeverity, L(`COOP: the header is not applied because ${reason}`, `COOP: l'header non viene applicato perché ${reason}`), {
      sources: ['rfc9651-fail', 'cs-coop-rec', 'zap-90004-3'],
      brief: reason.startsWith('it carries more than one') ? L('More than one value, so no policy is applied', "Più di un valore, quindi non viene applicata alcuna policy") : L('Invalid value, so no policy is applied', "Valore non valido, quindi non viene applicata alcuna policy"),
      description: L('A browser that cannot use this value applies unsafe-none, so this response has no COOP at all, the same position as never sending the header, with no Spectre or XS-Leak protection. Nothing in the response says so.', "Un browser che non può usare questo valore applica unsafe-none, quindi questa risposta non ha alcun COOP, la stessa situazione di chi non invia l'header, senza protezione contro Spectre o XS-Leak. Nulla nella risposta lo segnala.") + (extra || ''),
      recommendation: recommendation || L('Set Cross-Origin-Opener-Policy: same-origin', "Impostare Cross-Origin-Opener-Policy: same-origin"),
    });
  }

  const COOP_ALLOW_POPUPS_KEPT = {
    'same-origin-allow-popups': L('No cross-origin document can open this one into an existing browsing context group, so the protection COOP mainly exists for is in place.', "Nessun documento cross-origin può aprire questo in un browsing context group esistente, quindi la protezione per cui COOP esiste è attiva."),
    'noopener-allow-popups': L('Only a same-origin document sending this same value can navigate to this one without a browsing context group switch, and through window.open() not even that: stricter than same-origin in that direction. It does not provide cross-origin isolation, though: that needs same-origin plus COEP.', "Solo un documento della stessa origine che invia questo stesso valore può navigare verso questo senza cambio di browsing context group, e tramite window.open() nemmeno quello: più restrittivo di same-origin in quella direzione. Non fornisce però l'isolamento cross-origin: per quello servono same-origin più COEP."),
  };
  const COOP_VALUES = ['same-origin', 'same-origin-allow-popups', 'noopener-allow-popups', 'unsafe-none'];

  function checkCoop(value, ctx) {
    if (splitOutsideQuotes(value, ',').length > 1) {
      return [coopNotApplied(ctx, L('it carries more than one value', "contiene più di un valore"), L('Send Cross-Origin-Opener-Policy: same-origin once.', "Inviare Cross-Origin-Opener-Policy: same-origin una sola volta."))];
    }
    const t = structuredToken(value);
    if (t.invalid) return [coopNotApplied(ctx, L(`'${value.trim()}' is not a valid header value (${t.invalid})`, `'${value.trim()}' non è un valore valido per l'header (${t.invalid})`))];
    const n = t.token;
    if (n === 'same-origin') return [finding(COOP, Severity.OK, L('COOP: same-origin (optimal)', "COOP: same-origin (ottimale)"), { sources: ['cs-coop-rec', 'bp-coop'] })];
    if (n === 'same-origin-allow-popups' || n === 'noopener-allow-popups') {
      return [finding(COOP, Severity.LOW, L(`COOP: ${n} lets a window this document opens keep a reference back`, `COOP: ${n} permette a una finestra aperta da questo documento di mantenere un riferimento all'indietro`), {
        sources: ['asvs-3.4.8', 'cs-coop-rec'],
        brief: L(`${n} instead of same-origin`, `${n} invece di same-origin`),
        description: L(`${COOP_ALLOW_POPUPS_KEPT[n]} What it gives up is in the other direction: a window this document opens with window.open() stays in its browsing context group if that window sends no COOP of its own, so the window keeps a window.opener reference back and can probe this document through it. That only matters if this document opens windows it does not control.`, `${COOP_ALLOW_POPUPS_KEPT[n]} Ciò a cui rinuncia è nell'altra direzione: una finestra che questo documento apre con window.open() resta nel suo browsing context group se quella finestra non invia un proprio COOP, quindi mantiene un riferimento window.opener all'indietro e può sondare questo documento attraverso di esso. Conta solo se questo documento apre finestre che non controlla.`),
        ...check(L('Does this document open windows (window.open) on sites it does not control?', "Questo documento apre finestre (window.open) su siti che non controlla?"), L('yes', 'sì'), L('no, or only providers the site chose (an OAuth or payment flow)', "no, oppure solo fornitori scelti dal sito (un flusso OAuth o di pagamento)")),
      })];
    }
    if (n === 'unsafe-none') {
      return [finding(COOP, ctx.absentSeverity, L('COOP: unsafe-none opts this document out of COOP protection', "COOP: unsafe-none esclude questo documento dalla protezione COOP"), {
        sources: ['cs-coop-spectre', 'asvs-3.4.8', 'zap-90004-3'],
        brief: L('unsafe-none disables the protection', "unsafe-none disattiva la protezione"),
        description: L('Any document that opens this one shares its browsing context group and keeps a reference to its window, which is what XS-Leaks are probed through. It also rules out cross-origin isolation, which needs same-origin together with COEP.', "Qualsiasi documento che apre questo ne condivide il browsing context group e mantiene un riferimento alla sua finestra, che è ciò attraverso cui si sondano gli XS-Leak. Esclude anche l'isolamento cross-origin, che richiede same-origin insieme a COEP."),
        recommendation: L('Set Cross-Origin-Opener-Policy: same-origin', "Impostare Cross-Origin-Opener-Policy: same-origin"),
      })];
    }
    if (n.toLowerCase() === 'same-origin-plus-coep') {
      return [coopNotApplied(ctx, L('same-origin-plus-COEP cannot be set through this header', "same-origin-plus-COEP non si può impostare tramite questo header"),
        L('It is the result of Cross-Origin-Opener-Policy: same-origin together with Cross-Origin-Embedder-Policy: require-corp, not a value to send.', "È il risultato di Cross-Origin-Opener-Policy: same-origin insieme a Cross-Origin-Embedder-Policy: require-corp, non un valore da inviare."))];
    }
    return [coopNotApplied(ctx, L(`'${n}' is not a policy browsers recognize`, `'${n}' non è una policy riconosciuta dai browser`), '', caseHint(n, COOP_VALUES))];
  }

  function coepNoIsolation(ctx, title, why) {
    return finding(COEP, ctx.absentSeverity, title, {
      sources: ['cs-coep', 'zap-90004-2', 'rfc9651-fail'],
      brief: /more than one value/.test(title) ? L('More than one value, so no policy is applied', "Più di un valore, quindi non viene applicata alcuna policy") : /unsafe-none/.test(title) ? L('unsafe-none provides no isolation', "unsafe-none non fornisce alcun isolamento") : L('Invalid value, so no policy is applied', "Valore non valido, quindi non viene applicata alcuna policy"),
      description: L(`${why} Cross-origin resources requested in no-cors mode load without having to opt in through CORP, and the document is not cross-origin isolated, the same position as never sending the header. This fails safe: features that depend on the isolation are withheld, not left running without it.`, `${why} Le risorse cross-origin richieste in modalità no-cors si caricano senza doverlo consentire tramite CORP, e il documento non è isolato cross-origin, la stessa situazione di chi non invia l'header. Fallisce in modo sicuro: le funzioni che dipendono dall'isolamento vengono negate, non lasciate attive senza di esso.`),
      recommendation: L('Set Cross-Origin-Embedder-Policy: require-corp (with Cross-Origin-Opener-Policy: same-origin) if cross-origin isolation is wanted.', "Impostare Cross-Origin-Embedder-Policy: require-corp (con Cross-Origin-Opener-Policy: same-origin) se si vuole l'isolamento cross-origin."),
    });
  }

  function checkCoep(value, ctx) {
    if (splitOutsideQuotes(value, ',').length > 1) {
      return [coepNoIsolation(ctx, L('COEP: the header is not applied because it carries more than one value', "COEP: l'header non viene applicato perché contiene più di un valore"),
        L('Cross-Origin-Embedder-Policy must hold a single token, and a browser cannot parse this one, so it applies unsafe-none. Sending the header twice produces this, even when both copies are identical.', "Cross-Origin-Embedder-Policy deve contenere un solo token, e il browser non riesce a interpretare questo, quindi applica unsafe-none. Inviare l'header due volte produce questo risultato, anche quando le due copie sono identiche."))];
    }
    const t = structuredToken(value);
    if (t.invalid) {
      return [coepNoIsolation(ctx, L(`COEP: the header is not applied because '${value.trim()}' is not a valid header value`, `COEP: l'header non viene applicato perché '${value.trim()}' non è un valore valido`),
        L(`A browser cannot parse this value (${t.invalid}), so it applies unsafe-none.`, `Il browser non riesce a interpretare questo valore (${t.invalid}), quindi applica unsafe-none.`))];
    }
    const n = t.token;
    if (n === 'require-corp') {
      return [finding(COEP, Severity.OK, 'COEP: require-corp', {
        sources: ['cs-coep', 'html-coep-compat', 'bp-coep'],
        description: L('Cross-origin resources requested in no-cors mode must opt in through CORP or CORS. This is the COEP half of cross-origin isolation, which also needs Cross-Origin-Opener-Policy: same-origin.', "Le risorse cross-origin richieste in modalità no-cors devono acconsentire tramite CORP o CORS. È la metà COEP dell'isolamento cross-origin, che richiede anche Cross-Origin-Opener-Policy: same-origin."),
      })];
    }
    if (n === 'credentialless') {
      return [finding(COEP, Severity.OK, 'COEP: credentialless', {
        sources: ['html-coep-compat'],
        description: L('Cross-origin resources requested in no-cors mode load without having to opt in through CORP, but are fetched with no credentials, so they cannot carry anyone\'s private data. It qualifies for cross-origin isolation exactly as require-corp does: a different mechanism for the same guarantee, not a weaker one.', "Le risorse cross-origin richieste in modalità no-cors si caricano senza dover acconsentire tramite CORP, ma vengono scaricate senza credenziali, quindi non possono contenere dati privati di nessuno. Vale per l'isolamento cross-origin esattamente come require-corp: un meccanismo diverso per la stessa garanzia, non uno più debole."),
      })];
    }
    if (n === 'unsafe-none') {
      return [coepNoIsolation(ctx, L('COEP: unsafe-none is the value a browser applies anyway', "COEP: unsafe-none è il valore che il browser applica comunque"),
        L('unsafe-none is the default, so stating it changes nothing.', "unsafe-none è il valore predefinito, quindi dichiararlo non cambia nulla."))];
    }
    return [coepNoIsolation(ctx, L(`COEP: the header is not applied because '${n}' is not a policy browsers recognize`, `COEP: l'header non viene applicato perché '${n}' non è una policy riconosciuta dai browser`),
      L('A browser that does not recognise the token applies unsafe-none.', "Un browser che non riconosce il token applica unsafe-none.") + caseHint(n, ['require-corp', 'credentialless', 'unsafe-none']))];
  }

  // ---------------------------------------------------------------------------
  // Cross-Origin-Resource-Policy: Fetch "cross-origin resource policy check":
  // the value is compared byte for byte.
  // ---------------------------------------------------------------------------
  function checkCorp(value, ctx) {
    const H = 'Cross-Origin-Resource-Policy';
    const n = value.trim();
    if (n === 'same-origin' || n === 'same-site') return [finding(H, Severity.OK, `CORP: ${n}`, { sources: ['fetch-corp', 'cs-corp', 'bp-corp'] })];
